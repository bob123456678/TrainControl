route.ui.frameHelp=Un itinerario fa due cose: esegue in ordine i comandi in alto e pu\u00f2 essere trattenuto finch\u00e9 il plastico non si trova in un certo stato.\n\nCOMANDI\n\nOgni riga \u00e8 un\u2019azione: muovere uno scambio, mettere un segnale, lanciare un altro itinerario. L\u2019ordine \u00c8 l\u2019itinerario. La colonna del ritardo trattiene il comando successivo mentre un motore lento finisce.\n\nUno scambio a tre vie sta in una sola riga. In realt\u00e0 sono due motori su indirizzi consecutivi, e la riga scrive entrambi i comandi nell\u2019ordine in cui devono essere inviati, con una pausa in mezzo.\n\nCONDIZIONI\n\nL\u2019itinerario attende che siano vere. Ogni riga \u00e8 un fatto, e la riga e/o fra due righe dice come si combinano.\n\nIndenta una riga per annidarla. Tutto ci\u00f2 che sta allo stesso livello di indentazione \u00e8 un gruppo, e la parola di quel livello lo unisce. Tutte le parole di un livello devono essere la stessa; quella discorde \u00e8 mostrata in rosso. Sotto trovi il significato in parole.\n\nProva legge i sensori come sono adesso e dice se l\u2019itinerario scatterebbe.\n\nSenza condizioni l\u2019itinerario scatta ogni volta che viene attivato.
