route.ui.helpMessage=Gli itinerari sono semplicemente una serie di comandi eseguiti in sequenza. Usa la procedura guidata finch\u00e9 non ti sentirai a tuo agio a digitare i comandi.\n\nNel campo Comandi dell\u2019itinerario, inserisci un comando per riga: il nome dell\u2019accessorio e il suo stato, separati da una virgola. Ad esempio: Switch 20,turn oppure Signal 21,green. Puoi anche omettere il tipo di accessorio: 20,straight oppure 21,red. Ancora pi\u00f9 breve: sostituisci turn/red con 1 e straight/green con 0. Un terzo numero facoltativo indica un ritardo prima dell\u2019esecuzione, in millisecondi.\n\nSe vuoi che l\u2019itinerario venga eseguito automaticamente, indica l\u2019indirizzo di un sensore S88 di attivazione e imposta Esecuzione automatica su "Acceso".\n\nLe condizioni facoltative permettono di definire una logica basata su sensori S88 e/o stati degli accessori (nello stesso formato indicato sopra) che deve risultare vera anche perch\u00e9 l\u2019itinerario venga eseguito automaticamente. \u00c8 consentita la logica booleana con OR, AND e parentesi. Ad esempio, se l\u2019indirizzo S88 di attivazione \u00e8 10 e la condizione S88 \u00e8 "Feedback 11,0", l\u2019itinerario verr\u00e0 attivato solo se il sensore S88 11 risulta libero nel momento in cui scatta il sensore S88 10.\n\nOltre agli accessori, i comandi dell\u2019itinerario possono fare riferimento ad altri itinerari oppure alla velocit\u00e0, al senso di marcia e alle funzioni di una locomotiva:\nlocspeed,Nome della locomotiva,50 (imposta la velocit\u00e0 a 50)\nlocspeed,Nome della locomotiva,-1 (arresto immediato)\nlocdir,Nome della locomotiva,forward (oppure backward)\nlocfunc,Nome della locomotiva,20,1 (commuta F20).
