route.ui.helpMessage=Routes are simply a series of commands executed in sequence. Use the wizard until you are comfortable typing commands.\n\nIn the Route Commands field, one per line, enter the accessory name and state, separated by a comma. For example: Switch 20,turn or Signal 21,green. You can also skip the accessory type: 20,straight or 21,red. For even more brevity, replace turn/red with 1 or straight/green with 0. An optional third number specifies a delay before execution, in milliseconds.\n\nIf you want your route to execute automatically, specify a Triggering S88 sensor address and set Automatic Execution to "On".\n\nOptional Conditions allow you to specify logic consisting of S88 sensors and/or accessory states (in the same format as above) which must also evaluate to true for the route to automatically execute. Boolean logic with OR, AND, and parentheses is allowed. For example, if the Triggering S88 address is 10, and the S88 Condition is "Feedback 11,0", then the route would only fire if S88 11 was indicating clear at the time S88 10 was triggered.\n\nBeyond accessories, route commands can also reference other routes or locomotive speed, direction, and functions:\nlocspeed,Locomotive name,50 (sets speed to 50)\nlocspeed,Locomotive name,-1 (instant stop)\nlocdir,Locomotive name,forward (or backward)\nlocfunc,Locomotive name,20,1 (toggles F20).
