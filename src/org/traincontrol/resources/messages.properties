autosetup.ui.leftEdgeLocks={0} connections locked other connections by hand.  Locks are worked out from the track diagram now - two connections that share a square lock each other - so a hand-written lock between connections that share no square is not carried across.  Check any place where two trains must not move at once even though the track does not touch.
autosetup.ui.leftSignalAuthors={0} signals were switched by hand in your old setup (numbers {1}).  Signals are now driven only where you pair one with a station, from that station\u2019s own menu.  Check each of these: any you do not pair will simply stay green.
autosetup.ui.facingsGuessed={0} trains had the way they face chosen for them, because the old file does not show which way they ran.  Check each one on the diagram, and turn any that face the wrong way by right-clicking the train in the autonomy editor, before starting autonomy.
autosetup.ui.facingsNotHeld=The old file ran the trains at {0} a way this diagram does not let trains arrive, so each was stood the only way its square allows - the other way round from how it drives.  Check the directions on the track around them in the autonomy editor before starting autonomy, then turn each train with a right-click there.
autosetup.ui.directionsCarried=The old file\u2019s one-way running was carried onto {0} pieces of track the diagram had left at their defaults.  Directions you had set yourself were kept.  Check them on the diagram before starting autonomy.
autosetup.ui.directionsNotCarried=The old file ran {0} pieces of track one way that this diagram does not.  They were left as the diagram has them, because its directions have already been set.  Check them on the diagram if trains should run the way the old version ran them.
autosetup.ui.autoLoadOffAfterImport={0} > {1} has been unticked, as it is after every import of an old autonomy.json.  Tick it to load this setup when TrainControl starts.
autosetup.ui.leftModernFields={0} squares carried settings the old format never had - so this looks like a setup exported from this version rather than an older file.  Importing it this way keeps only what the old format could say, and drops the rest.  If that is what happened, load the setup instead of importing it.
