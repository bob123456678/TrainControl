route.ui.frameHelp=A route does two things: it works through the commands at the top, in order, and it can be held back until the railway is in a particular state.\n\nCOMMANDS\n\nEach row is one thing to do - throw a switch, set a signal, run another route. The order is the route: a switch thrown after a train has passed is a different railway from one thrown before. The delay column holds the next command back while a slow motor finishes.\n\nA three-way point is a single row. It is really two motors at consecutive addresses, and the row writes both commands in the order they have to be sent, with a pause between them.\n\nCONDITIONS\n\nThe route is held until these are true. Each row is one fact - S88 1 is on, switch 3 is turned - and the and/or line between two rows says how they join.\n\nIndent a row to nest it. Everything at one level of indentation is one group, and the word at that level joins it: an "or" indented under an "and" means this AND (that OR the other). Every word at one level has to be the same word, and one that disagrees is shown in red until it is indented or changed. Underneath you will see what the whole thing means in words.\n\nTest reads the sensors as they are right now and says whether the route would fire.\n\nLeave the conditions empty and the route fires whenever it is triggered.
