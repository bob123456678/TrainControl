route.ui.helpMessage=Un itin\u00e9raire est simplement une suite de commandes ex\u00e9cut\u00e9es l\u2019une apr\u00e8s l\u2019autre. Utilisez l\u2019assistant jusqu\u2019\u00e0 ce que vous soyez \u00e0 l\u2019aise pour saisir les commandes directement.\n\nDans le champ Commandes de l\u2019itin\u00e9raire, saisissez une commande par ligne: le nom de l\u2019accessoire et son \u00e9tat, s\u00e9par\u00e9s par une virgule. Par exemple: Switch 20,turn ou Signal 21,green. Vous pouvez aussi omettre le type d\u2019accessoire: 20,straight ou 21,red. Plus court encore, remplacez turn/red par 1 et straight/green par 0. Un troisi\u00e8me nombre facultatif indique un d\u00e9lai avant ex\u00e9cution, en millisecondes.\n\nSi vous souhaitez que votre itin\u00e9raire s\u2019ex\u00e9cute automatiquement, indiquez l\u2019adresse d\u2019un capteur S88 d\u00e9clencheur et r\u00e9glez Ex\u00e9cution automatique sur \u00ab Marche \u00bb.\n\nLes conditions facultatives permettent de d\u00e9finir une logique portant sur des capteurs S88 et/ou des \u00e9tats d\u2019accessoires (au m\u00eame format que ci-dessus) qui doit \u00e9galement \u00eatre vraie pour que l\u2019itin\u00e9raire s\u2019ex\u00e9cute automatiquement. La logique bool\u00e9enne avec OR, AND et des parenth\u00e8ses est autoris\u00e9e. Par exemple, si l\u2019adresse S88 d\u00e9clencheuse est 10 et que la condition S88 est \u00ab Feedback 11,0 \u00bb, l\u2019itin\u00e9raire ne se d\u00e9clenchera que si le S88 11 indique \u00ab libre \u00bb au moment o\u00f9 le S88 10 est d\u00e9clench\u00e9.\n\nOutre les accessoires, les commandes d\u2019itin\u00e9raire peuvent aussi r\u00e9f\u00e9rencer d\u2019autres itin\u00e9raires ou la vitesse, le sens de marche et les fonctions d\u2019une locomotive:\nlocspeed,Nom de la locomotive,50 (r\u00e8gle la vitesse \u00e0 50)\nlocspeed,Nom de la locomotive,-1 (arr\u00eat imm\u00e9diat)\nlocdir,Nom de la locomotive,forward (ou backward)\nlocfunc,Nom de la locomotive,20,1 (bascule F20).
