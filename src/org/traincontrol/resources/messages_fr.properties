# Untranslated: English text, kept here so the key set matches messages.properties.
# Replace the values as these are translated.
autolayout.errorAutoDestinationInvalidValue=The autoDestination value for point {0} must be true or false.
autosetup.ui.errorScissorsNotSupported=Une travers\u00e9e-jonction en {0} ne peut pas \u00eatre utilis\u00e9e par l\u2019autonomie. C\u2019est une fa\u00e7on de dessiner un scambio \u00e0 double travers\u00e9e sur deux cases, si bien que la voie qui la traverse ne peut pas \u00eatre d\u00e9termin\u00e9e \u00e0 partir de l\u2019une ou l\u2019autre case seule. Remplacez-la par des cases d\u2019aiguillage ordinaires, ou laissez cette page hors de l\u2019autonomie.
autosetup.ui.errorTileHasNoAddress=L\u2019aiguillage ou le signal en {0} n\u2019a pas d\u2019adresse num\u00e9rique, donc TrainControl ne peut pas le commander. Un train envoy\u00e9 dessus devrait faire confiance qu\u2019il est d\u00e9j\u00e0 dans le bon sens. Donnez-lui une adresse, ou laissez cette page hors de l\u2019autonomie.
autosetup.ui.errorAdjacentRouteTiles={0} : deux boutons d\u2019itin\u00e9raire sont c\u00f4te \u00e0 c\u00f4te avec de la voie qui y aboutit, si bien que la paire conduit un itin\u00e9raire sur une portion de plan sans rails.  \u00c9loignez l\u2019un des deux de la voie.
autosetup.ui.errorRouteTileThreeWay={0} : de la voie aboutit \u00e0 ce bouton d\u2019itin\u00e9raire par trois c\u00f4t\u00e9s.  Il ne peut en conduire qu\u2019un seul, le troisi\u00e8me est abandonn\u00e9 - dessinez la bifurcation sur un aiguillage plut\u00f4t que sur un bouton.
autosetup.ui.errorLinkNotMutuallyPaired=La liaison en {0} n\u2019est pas associ\u00e9e \u00e0 une liaison qui pointe en retour vers elle. Chaque liaison doit d\u00e9signer exactement un partenaire, et ce partenaire doit la d\u00e9signer en retour, sinon un train pourrait la franchir et ne plus pouvoir revenir.
autosetup.ui.warnLinkNeverPaired=La liaison en {0} n\u2019a \u00e9t\u00e9 associ\u00e9e \u00e0 rien, donc elle ne m\u00e8ne nulle part : la voie qui y arrive s\u2019y termine, et ce \u00e0 quoi elle devait continuer ne peut pas \u00eatre atteint par ce chemin. Cliquez droit dessus pour l\u2019associer, ou d\u00e9sactivez-la pour qu\u2019elle ne soit plus signal\u00e9e.
autosetup.ui.warnLinkNeverPairedUnreachable=La liaison en {0} n\u2019a pas \u00e9t\u00e9 associ\u00e9e, mais aucune voie n\u2019y m\u00e8ne non plus - rien ne peut donc l\u2019atteindre. Associez-la si elle devait mener quelque part, ou laissez-la hors de l\u2019autonomie.
autosetup.ui.warnLinkToExcludedPage=La liaison en {0} pointe vers une page qui ne fait pas partie de l\u2019autonomie, il n\u2019y a donc rien \u00e0 lui associer\u00a0: la voie qui y m\u00e8ne s\u2019arr\u00eate l\u00e0. Incluez cette page dans l\u2019autonomie si l\u2019itin\u00e9raire compte, ou d\u00e9sactivez la liaison pour qu\u2019elle ne soit plus signal\u00e9e.
autosetup.ui.errorNotANumber=\u00ab {0} \u00bb n\u2019est pas un nombre entier, donc rien n\u2019a \u00e9t\u00e9 chang\u00e9.
autosetup.ui.errorLabelWriteFailed=Les noms de stations autrefois stock\u00e9s dans le plan des voies sont d\u00e9sormais conserv\u00e9s avec la configuration d\u2019autonomie, mais ces pages n\u2019ont pas pu \u00eatre r\u00e9\u00e9crites pour retirer les anciennes copies : {0}. Rien n\u2019a \u00e9t\u00e9 perdu, et TrainControl r\u00e9essaiera au prochain d\u00e9marrage.
autosetup.ui.errorEditorAlreadyOpen=Un \u00e9diteur est d\u00e9j\u00e0 ouvert sur ce plan. Fermez-le avant d\u2019en ouvrir un autre - deux \u00e9diteurs partagent un m\u00eame plan, et chacun annulerait les changements de l\u2019autre.
autosetup.ui.errorNoSetupToEdit=La configuration d\u2019autonomie ne peut pas \u00eatre ouverte pour ce plan.\n\nElle a besoin d\u2019un dossier de plan local dans lequel TrainControl peut \u00e9crire.
autosetup.ui.confirmExitWithoutSaving=Fermer l\u2019\u00e9diteur d\u2019autonomie et jeter tout ce qui a \u00e9t\u00e9 chang\u00e9 depuis le dernier enregistrement ?\n\nCela inclut tout nom de station que vous avez plac\u00e9 sur le plan dans cette fen\u00eatre.
autosetup.ui.confirmJumpWithUnsavedEdits=Aller \u00e0 l\u2019autre bout de cette liaison ?\n\nCette fen\u00eatre va se fermer et se rouvrir sur cette page. Rien n\u2019est perdu - tout ce que vous avez chang\u00e9 est conserv\u00e9 - mais ce n\u2019est pas encore enregistr\u00e9.
autosetup.ui.errorDiscardFailed=Les changements n\u2019ont pas pu \u00eatre annul\u00e9s, car la configuration enregistr\u00e9e n\u2019a pas pu \u00eatre relue : {0}. L\u2019\u00e9diteur est rest\u00e9 ouvert pour que rien ne soit perdu.
autosetup.ui.menuFacingGroup={0} est orient\u00e9e...
autosetup.ui.hintFacing=Dans quel sens le train est arr\u00eat\u00e9. Deux voies m\u00e8nent \u00e0 cette case, un train ici a donc pu arriver par l\u2019une ou l\u2019autre, et le sens vers lequel il pointe d\u00e9cide o\u00f9 il peut aller ensuite - un train ne peut pas partir en marche arri\u00e8re. Laissez tel quel en cas de doute : l\u2019autonomie le corrige d\u00e8s que le train roule la premi\u00e8re fois.
autosetup.ui.facingN=Nord (vers le haut du plan)
autosetup.ui.facingE=Est (\u00e0 droite)
autosetup.ui.facingS=Sud (vers le bas)
autosetup.ui.facingW=Ouest (\u00e0 gauche)
autosetup.ui.menuUseLink=L\u2019autonomie utilise cette liaison
autosetup.ui.hintUseLink=D\u00e9sactivez ceci pour une liaison qui appartient au dessin plut\u00f4t qu\u2019au r\u00e9seau sur lequel l\u2019autonomie circule. Elle ne transporte alors aucun train et n\u2019est pas signal\u00e9e comme non associ\u00e9e.
autosetup.ui.errorPortalTargetsExcludedPage=La liaison en {0} pointe vers une page laiss\u00e9e hors de l\u2019autonomie. Associez-la soit \u00e0 une liaison sur une page utilis\u00e9e par l\u2019autonomie, soit laissez-la non associ\u00e9e pour qu\u2019aucun train n\u2019essaie de la franchir.
autosetup.ui.warnTurntableNotRoutable=L\u2019autonomie s\u2019arr\u00eate au pont tournant en {0} et n\u2019y fera jamais rouler de train dessus. Le reste du plan n\u2019est pas affect\u00e9.
autosetup.ui.warnPermanentTurnout=L\u2019aiguillage en {0} est marqu\u00e9 comme n\u2019ayant pas d\u2019adresse, donc les trains ne peuvent le franchir qu\u2019en pointe \u00e9vit\u00e9e (talonnage), o\u00f9 la position des aiguilles n\u2019a pas d\u2019importance.
autosetup.ui.errorCompanionVersion=Cette configuration d\u2019autonomie a \u00e9t\u00e9 \u00e9crite par une version plus r\u00e9cente de TrainControl et ne peut pas \u00eatre lue. Mettez TrainControl \u00e0 jour, ou d\u00e9placez les fichiers de config/autonomy pour repartir de z\u00e9ro.
autosetup.ui.errorDeleteConfigurationFailed=Impossible de supprimer {0}. Le fichier est peut-\u00eatre ouvert dans un autre programme, retenu par un client de synchronisation, ou dans un dossier o\u00f9 cet ordinateur ne peut pas \u00e9crire.
autosetup.ui.errorRenameConfigurationFailed=Impossible de renommer {0}. Le fichier est peut-\u00eatre ouvert dans un autre programme, retenu par un client de synchronisation, ou dans un dossier o\u00f9 cet ordinateur ne peut pas \u00e9crire. Rien n\u2019a \u00e9t\u00e9 chang\u00e9.
autosetup.ui.errorConfigurationUnreadable=La configuration d\u2019autonomie {0} n\u2019a pas pu \u00eatre lue, donc rien n\u2019a \u00e9t\u00e9 chang\u00e9 : {1}
autosetup.ui.errorAutonomyNeedsLocalLayout=L\u2019autonomie a besoin d\u2019une copie locale du plan des voies, car ses r\u00e9glages sont stock\u00e9s \u00e0 c\u00f4t\u00e9 des fichiers du plan. T\u00e9l\u00e9chargez d\u2019abord le r\u00e9seau depuis la Central Station.
autosetup.ui.checkStationReachesNothing=Aucun train ne peut quitter {0} vers une autre station. V\u00e9rifiez les sens des voies qui en partent.
autosetup.ui.checkStationUnreachable=Aucun train ne peut atteindre {0} depuis une autre station.  V\u00e9rifiez les sens des voies qui y m\u00e8nent, et si les arriv\u00e9es par le c\u00f4t\u00e9 d\u2019acc\u00e8s y sont interdites.
autosetup.ui.checkTerminusStranded=Un train envoy\u00e9 \u00e0 {0} ne pourrait rejoindre aucune autre station.  V\u00e9rifiez les sens des voies qui en partent, et si les arriv\u00e9es par le c\u00f4t\u00e9 de d\u00e9part y sont interdites.
autosetup.ui.checkPointIsolated=Rien n\u2019est connect\u00e9 \u00e0 {0}, donc aucun train n\u2019y passera jamais. Sa voie est dessin\u00e9e, mais toute connexion vers elle a \u00e9t\u00e9 ferm\u00e9e.
autosetup.ui.checkRunClosedBothWays=La voie en {0} est ferm\u00e9e dans les deux sens, donc rien ne peut y passer. C\u2019est en g\u00e9n\u00e9ral une erreur de clic en r\u00e9glant la circulation \u00e0 sens unique.
autosetup.ui.checkNoStations=Aucune station n\u2019a encore \u00e9t\u00e9 d\u00e9sign\u00e9e, donc l\u2019autonomie n\u2019a nulle part o\u00f9 envoyer un train. Marquez au moins deux capteurs comme stations.
autosetup.ui.checkOneStation={0} est la seule station, donc l\u2019autonomie n\u2019a nulle part d\u2019autre o\u00f9 envoyer un train. D\u00e9signez-en au moins une de plus.
autosetup.ui.checkUnnamedPoint=Le capteur en {0} porte encore le nom qui lui a \u00e9t\u00e9 donn\u00e9 automatiquement. Les trains le franchissent sans s\u2019y arr\u00eater, donc c\u2019est plut\u00f4t \u00e0 ranger qu\u2019urgent - mais c\u2019est le nom sous lequel un trajet par ici sera d\u00e9sign\u00e9.
autosetup.ui.checkMayTurnOnDeadEnd={0} est r\u00e9gl\u00e9 sur "les trains peuvent changer de direction ici", mais aucun train arrivant ne peut continuer - chaque entr\u00e9e ne m\u00e8ne qu\u2019au retour, donc tous font demi-tour de toute fa\u00e7on.  "Doit" le dit plus clairement.
autosetup.ui.checkReversingLeadsNowhere=Les trains font demi-tour a {0}, mais aucune gare n\u2019est accessible depuis cet endroit\u00a0: un train envoye la ferait demi-tour sans avoir ou aller. Si la voie devait etre ouverte, c\u2019est cette case qu\u2019il faut regarder.
autosetup.ui.checkCaptionCovered=Le nom de {0} n\u2019est pas visible : la case sur laquelle sa l\u00e9gende est dessin\u00e9e porte aussi votre propre texte, et c\u2019est votre texte qui s\u2019affiche. D\u00e9placez la l\u00e9gende sur une case libre, ou effacez le texte.
autosetup.ui.checkHomeNeedsReversible=La station de garage en {0} ne peut \u00eatre utilis\u00e9e que par une locomotive capable de changer de sens. Chaque train doit faire demi-tour sur cette case, donc un train qui ne le peut pas n\u2019y sera jamais renvoy\u00e9.
autosetup.ui.checkReversalNeedsLength=Les trains rebroussent a {0} et aucune longueur n\u2019est enregistree pour cette voie\u00a0: impossible de savoir si un train long se retrouverait a cheval sur l\u2019aiguille situee derriere.  Renseignez la longueur de la voie.
autosetup.ui.checkReversalNeedsLengthRun=Les trains rebroussent a {0} et {2} cases sur place et sur le parcours d\u2019acces n\u2019ont aucune longueur enregistree\u00a0: impossible de savoir si un train long se retrouverait a cheval sur l\u2019aiguille situee derriere.  Renseignez les longueurs de voie.
autosetup.ui.checkCopyNoWayOut=Un train qui arrive a {0} par la ne peut plus repartir\u00a0: aucune voie n\u2019en sort.  L\u2019automatisme peut malgre tout l\u2019y envoyer.  Ouvrez une sortie, ou interdisez l\u2019arrivee par ce cote.
autosetup.ui.checkCopyNoWayIn=Rien ne peut atteindre {0}\u00a0: aucune voie n\u2019y entre.  Un train laisse la ne sera pas deplace par le retour au garage et bloquera tout ce qui se trouve derriere.
autosetup.ui.checkCopyReachesNothing=Un train qui arrive a {0} par la ne va pas plus loin\u00a0: aucune autre gare n\u2019est accessible depuis cet endroit.  Il peut repartir, mais toutes les voies y ramenent.  L\u2019automatisme peut malgre tout l\u2019y envoyer.  Ouvrez une continuation, ou interdisez l\u2019arrivee par ce cote.
autosetup.ui.checkProtectingSignalGone=Un signal associ\u00e9 \u00e0 {0} n\u2019est plus sur ce plan, donc ce quai n\u2019est plus enti\u00e8rement prot\u00e9g\u00e9. Associez-le \u00e0 un autre signal, ou retirez l\u2019association.
autosetup.ui.checkFacingImpossible={0} a une locomotive enregistr\u00e9e comme orient\u00e9e dans un sens que cette case ne permet plus - la voie autour a chang\u00e9 depuis. L\u2019autonomie la placera dans le premier sens que la case propose, qui peut \u00eatre l\u2019autre. R\u00e9glez le sens depuis le menu contextuel.
autosetup.ui.checkNoProtectingSignal={0} n\u2019a aucun signal associ\u00e9.
autosetup.ui.checkDuplicateLocomotive={0} porte une locomotive \u00e9galement enregistr\u00e9e comme se trouvant ailleurs. Une locomotive ne peut \u00eatre qu\u2019\u00e0 un seul endroit, et l\u2019autonomie refuse toute la configuration tant qu\u2019elle est \u00e0 deux - retirez-la donc de la case o\u00f9 elle ne se trouve pas.
autosetup.ui.checkNoTrainLength=Aucune longueur n\u2019est d\u00e9finie pour {1}, en {0}\u00a0; ce train ne sera donc jamais refus\u00e9 \u00e0 un quai.
autosetup.ui.checkNoMaxTrainLength={0} n\u2019a pas de longueur maximale\u00a0: aucun train n\u2019y sera jamais trop long.
autosetup.ui.checkDuplicateSensorPage={1}, un capteur repr\u00e9sente donc deux endroits et aucun train ne peut y \u00eatre localis\u00e9.  D\u00e9sactivez l\u2019une des pages, ou donnez son propre capteur \u00e0 l\u2019une des deux cases.
autosetup.ui.duplicateSensorSubject=Le capteur s88 {0} se trouve sur la page \u00ab\u00a0{1}\u00a0\u00bb et aussi sur la page \u00ab\u00a0{2}\u00a0\u00bb
autosetup.ui.checkArrivalTrapped=Un train atteignant {0} par au moins un sens ne pourrait pas continuer : la seule voie devant lui est celle par laquelle il vient d\u2019arriver, et un train ne peut pas faire demi-tour ici. R\u00e9glez soit \u00ab les trains peuvent changer de sens ici \u00bb, soit ouvrez la voie devant.
autosetup.ui.checkUnnamedStation=La station en {0} porte encore le nom qui lui a \u00e9t\u00e9 donn\u00e9 automatiquement. C\u2019est le nom par lequel vous la choisirez et sous lequel les arriv\u00e9es seront annonc\u00e9es, donnez-lui donc un nom que vous utiliseriez \u00e0 voix haute.
