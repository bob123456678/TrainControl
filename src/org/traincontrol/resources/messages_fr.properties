autolayout.ui.tooltip.pathPreferenceFEWEST_POINTS=The route crossing the fewest sensors.  That depends on where the s88s happen to be installed rather than on the shape of the railway.
autolayout.ui.tooltip.pathPreferenceRANDOM=Le premier itin\u00e9raire libre trouv\u00e9, les gares de priorit\u00e9 la plus \u00e9lev\u00e9e \u00e9tant essay\u00e9es d\u2019abord.  C\u2019est le r\u00e9glage par d\u00e9faut et le comportement des versions pr\u00e9c\u00e9dentes\u00a0; le laisser tel quel ne change rien.  C\u2019est aussi le plus rapide \u00e0 calculer.
autolayout.ui.tooltip.pathPreferenceRANDOM_ANY_STATION=Le premier itin\u00e9raire libre trouv\u00e9, vers n\u2019importe quelle gare.  La priorit\u00e9 des gares est ignor\u00e9e\u00a0; c\u2019est toute la diff\u00e9rence avec la r\u00e8gle au-dessus.
