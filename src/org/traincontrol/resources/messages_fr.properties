autolayout.warnRemovedConflictingLocomotive=Avertissement d\u2019autonomie: {0} a \u00e9t\u00e9 retir\u00e9 de {1}, car il ne peut pas y circuler en m\u00eame temps que {2}.
autosetup.log.captionsMigrated=Les noms de gare inscrits sur le plan par une version ant\u00e9rieure ont \u00e9t\u00e9 repris dans la configuration d\u2019autonomie et retir\u00e9s de ces pages: {0} ({1} nom(s) au total).  \u00c0 c\u00f4t\u00e9 du .cs2 de chacune se trouve un fichier .bak contenant la page telle qu\u2019elle \u00e9tait la premi\u00e8re fois que cette version l\u2019a r\u00e9\u00e9crite.
autosetup.log.setupEditNotApplied=Une modification de la configuration n\u2019a pas pu \u00eatre appliqu\u00e9e au r\u00e9seau en marche, car l\u2019autonomie a d\u00e9marr\u00e9 entre la modification et le moment de l\u2019appliquer.  La modification EST enregistr\u00e9e - arr\u00eatez l\u2019autonomie et refaites-la pour qu\u2019elle prenne effet maintenant, sinon elle sera reprise au prochain chargement.
autosetup.log.noteRepairFailed=Un enregistrement d\u2019une modification du plan inachev\u00e9e n\u2019a pas pu \u00eatre mis \u00e0 jour pour la locomotive renomm\u00e9e; il nomme toujours l\u2019ancienne: config/autonomy/setup-before-edit.json.  Si TrainControl est red\u00e9marr\u00e9 avant la fin de cette modification, la configuration restaur\u00e9e nommera une locomotive qui n\u2019existe plus - supprimez ce fichier pour l\u2019\u00e9viter.
autosetup.log.unfinishedEditNoteUnusable=Un enregistrement d\u2019une modification du plan inachev\u00e9e n\u2019a pas pu \u00eatre utilis\u00e9 et a \u00e9t\u00e9 conserv\u00e9: config/autonomy/setup-before-edit.json
autosetup.log.unfinishedEditReverted=La derni\u00e8re modification du plan ne s\u2019est pas termin\u00e9e; la configuration d\u2019autonomie a \u00e9t\u00e9 remise dans son \u00e9tat ant\u00e9rieur.
autosetup.log.placementsNotSaved=L\u2019endroit o\u00f9 chaque locomotive s\u2019est arr\u00eat\u00e9e n\u2019a pas \u00e9t\u00e9 enregistr\u00e9, car une modification faite pendant que l\u2019autonomie tournait n\u2019a pas pu \u00eatre appliqu\u00e9e alors.  L\u2019enregistrement aurait \u00e9cras\u00e9 cette modification par l\u2019ancien r\u00e9seau.  La modification elle-m\u00eame est intacte et sera l\u00e0 la prochaine fois.
autosetup.log.saveFailedAfterCombine=La configuration d\u2019autonomie n\u2019a pas pu \u00eatre enregistr\u00e9e apr\u00e8s la fusion des pages; la nouvelle page pourra \u00eatre propos\u00e9e \u00e0 l\u2019autonomie au prochain chargement.
