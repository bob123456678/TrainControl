autosetup.ui.warnPageRenumbered=La page \u00ab {0} \u00bb semble avoir \u00e9t\u00e9 renum\u00e9rot\u00e9e, et ce num\u00e9ro appartient maintenant \u00e0 \u00ab {1} \u00bb. Ses r\u00e9glages d\u2019autonomie ont \u00e9t\u00e9 appari\u00e9s par le nom de la page et appliqu\u00e9s \u00e0 la bonne voie.  Rien n\u2019est nettoy\u00e9 tant que cela dure, pas m\u00eame lors d\u2019un enregistrement, car une case qui para\u00eet absente peut n\u2019\u00eatre qu\u2019une case dont le num\u00e9ro de page a chang\u00e9.  Enregistrez la configuration pour inscrire la nouvelle num\u00e9rotation ; l\u2019avis dispara\u00eetra au prochain chargement.
