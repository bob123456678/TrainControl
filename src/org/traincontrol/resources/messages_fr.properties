autosetup.ui.promptPointName=Comment ce capteur doit-il s\u2019appeler ? Le nom appara\u00eet dans le journal, dans les horaires et sur le plan, donc quelque chose comme \u00ab Entr\u00e9e voie 14 \u00bb est plus pratique qu\u2019une coordonn\u00e9e.
autosetup.ui.labelPointNotStation=Seul un capteur peut \u00eatre une station, car l\u2019autonomie n\u2019a autrement aucun moyen de savoir qu\u2019un train est arriv\u00e9. Choisissez une case de r\u00e9trosignalisation.
autosetup.ui.promptLinkName=Comment cette liaison doit-elle s\u2019appeler ? Cliquez ensuite sur la liaison \u00e0 laquelle elle m\u00e8ne, sur cette page ou une autre.
autosetup.ui.promptTileLength=Quelle longueur compte cette pi\u00e8ce de voie ? Les longueurs sont vos propres unit\u00e9s, additionn\u00e9es le long d\u2019un trajet et compar\u00e9es aux longueurs de train. 0 signifie qu\u2019elle ne compte pas.
