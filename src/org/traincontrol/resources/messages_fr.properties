route.ui.frameLockedExplains=Cet itin\u00e9raire appartient \u00e0 la Central Station. Modifiez-le l\u00e0-bas puis synchronisez.
route.ui.frameHelp=Un itin\u00e9raire fait deux choses : il ex\u00e9cute les commandes du haut dans l\u2019ordre, et il peut \u00eatre retenu jusqu\u2019\u00e0 ce que le r\u00e9seau soit dans un \u00e9tat donn\u00e9.\n\nCOMMANDES\n\nChaque ligne est une action : manoeuvrer un aiguillage, mettre un signal, lancer un autre itin\u00e9raire. L\u2019ordre EST l\u2019itin\u00e9raire. La colonne de temporisation retient la commande suivante pendant qu\u2019un moteur lent termine.\n\nUn aiguillage triple tient sur une seule ligne. Ce sont en r\u00e9alit\u00e9 deux moteurs \u00e0 des adresses cons\u00e9cutives, et la ligne \u00e9crit les deux commandes dans l\u2019ordre o\u00f9 elles doivent partir, avec une pause entre elles.\n\nCONDITIONS\n\nL\u2019itin\u00e9raire attend qu\u2019elles soient vraies. Chaque ligne est un fait, et la ligne et/ou entre deux lignes dit comment elles se combinent.\n\nIndentez une ligne pour l\u2019imbriquer. Tout ce qui est au m\u00eame niveau d\u2019indentation forme un groupe, et le mot de ce niveau le relie. Tous les mots d\u2019un niveau doivent \u00eatre le m\u00eame ; celui qui diff\u00e8re appara\u00eet en rouge. En dessous, vous lirez ce que le tout signifie en toutes lettres.\n\nTest lit les capteurs tels qu\u2019ils sont maintenant et dit si l\u2019itin\u00e9raire se d\u00e9clencherait.\n\nSans conditions, l\u2019itin\u00e9raire se d\u00e9clenche chaque fois qu\u2019il est appel\u00e9.
