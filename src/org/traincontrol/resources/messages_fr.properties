autosetup.ui.promptMassAssignTrainLength=Locomotive {0} sur {1}, {2}, sur {3}.  Saisissez la longueur de ce train.  Elle est enregistr\u00e9e sur la locomotive elle-m\u00eame, pas dans cette configuration : Annuler dans cette fen\u00eatre ne l\u2019annule pas :
