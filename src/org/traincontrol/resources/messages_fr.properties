autolayout.ui.confirmClearAllMaxTrainLengthsAtOnce=Ceci effacera la longueur de train maximale de {0} gares, sur toutes les pages. \nChacune acceptera ensuite un train de n\u2019importe quelle longueur.  C\u2019est enregistr\u00e9 aussit\u00f4t.  \u00cates-vous s\u00fbr ?
autolayout.ui.confirmClearAllTrackLengthsAtOnce=Ceci effacera la longueur de {0} cases, sur toutes les pages. \nLes longueurs d\u00e9cident si un train tient l\u00e0 o\u00f9 on l\u2019envoie ; les effacer suspend ces refus jusqu\u2019\u00e0 ce que vous mesuriez de nouveau.  C\u2019est enregistr\u00e9 aussit\u00f4t, et seul un nouveau relev\u00e9 les ram\u00e8ne.  \u00cates-vous s\u00fbr ?
