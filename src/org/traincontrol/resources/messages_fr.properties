autosetup.ui.infoEveryTrainHasALength=Chaque locomotive que l\u2019autonomie ferait rouler a d\u00e9j\u00e0 une longueur de train\u00a0: ceci les passe toutes en revue, pour pouvoir en changer une.
autosetup.ui.infoNoTrainToMeasure=Aucune locomotive n\u2019est plac\u00e9e pour que l\u2019autonomie la fasse rouler\u00a0: il n\u2019y a donc pas de longueur de train \u00e0 r\u00e9gler.
