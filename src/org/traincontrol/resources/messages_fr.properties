autosetup.ui.errorImportUnrecognised=Ce fichier n\u2019est pas une configuration d\u2019autonomie. Choisissez une configuration export\u00e9e depuis TrainControl, ou un autonomy.json d\u2019une version plus ancienne.
autosetup.ui.infoImported=Import\u00e9. {0} noms de stations, longueurs et autres r\u00e9glages de voie ont \u00e9t\u00e9 repris du fichier pour combler les manques de cette configuration.
autosetup.ui.infoPagesExcludedForSensors={0} page(s) laiss\u00e9e(s) hors de l\u2019autonomie car elles r\u00e9p\u00e8tent des adresses de r\u00e9trosignalisation d\u00e9j\u00e0 utilis\u00e9es par une page ant\u00e9rieure : {1}. Deux cases partageant une adresse ne peuvent pas \u00eatre distingu\u00e9es, donc c\u2019est la page ant\u00e9rieure qui est conserv\u00e9e. Vous pouvez r\u00e9activer n\u2019importe quelle page depuis l\u2019\u00e9diteur d\u2019autonomie.
autosetup.ui.infoLegacyImported={0} cases nomm\u00e9es, {1} locomotives plac\u00e9es, {2} marqu\u00e9es comme faisant faire demi-tour aux trains, et {3} autres r\u00e9glages repris. {4} cases avaient d\u00e9j\u00e0 un nom et ont \u00e9t\u00e9 laiss\u00e9es telles quelles. {5} points n\u2019ont pas pu \u00eatre associ\u00e9s \u00e0 un capteur sur ce plan.
autosetup.ui.leftBehind={0} \u00e9l\u00e9ments du fichier n\u2019ont volontairement pas \u00e9t\u00e9 import\u00e9s.  Le journal les d\u00e9taille.
autosetup.ui.leftBehindHeading=Cet import a d\u00e9lib\u00e9r\u00e9ment laiss\u00e9 ce qui suit.  Tout reste dans le fichier lu, qui n\u2019est pas modifi\u00e9 :
autosetup.ui.leftEdgeCommands={0} liaisons portaient des commandes d\u2019accessoires.  Les commandes sont d\u00e9sormais d\u00e9duites du plan de voie et ne sont pas reprises.
autosetup.ui.leftEdgeLengths={0} liaisons portaient une longueur.  Les longueurs appartiennent aux cases d\u00e9sormais, et une longueur par liaison ne peut pas \u00eatre r\u00e9partie.
autosetup.ui.leftEdgeLocks={0} connexions en verrouillaient d\u2019autres manuellement.  Les verrouillages sont maintenant d\u00e9duits du plan de voies - deux connexions qui partagent une case se verrouillent mutuellement - un verrouillage manuel entre des connexions sans case commune n\u2019est donc pas repris.  V\u00e9rifiez tout endroit o\u00f9 deux trains ne doivent pas circuler en m\u00eame temps bien que les voies ne se touchent pas.
autosetup.ui.leftSignalAuthors={0} signaux \u00e9taient command\u00e9s manuellement dans votre ancienne configuration (num\u00e9ros {1}).  Les signaux ne sont d\u00e9sormais command\u00e9s que l\u00e0 o\u00f9 vous en associez un \u00e0 une gare, depuis le menu de cette gare.  V\u00e9rifiez-les tous\u00a0: ceux que vous n\u2019associez pas resteront simplement au vert.
autosetup.ui.facingsGuessed=Pour {0} trains, le sens a \u00e9t\u00e9 choisi automatiquement, car l\u2019ancien fichier ne montre pas dans quel sens ils roulaient.  V\u00e9rifiez chacun sur le plan et retournez ceux qui sont dans le mauvais sens depuis leur menu contextuel dans l\u2019\u00e9diteur d\u2019autonomie, avant de d\u00e9marrer l\u2019autonomie.
autosetup.ui.facingsNotHeld=L\u2019ancien fichier faisait rouler les trains de {0} dans un sens o\u00f9 ce plan ne permet pas d\u2019arriver ; chacun a donc \u00e9t\u00e9 plac\u00e9 dans le seul sens que sa case permet, \u00e0 l\u2019inverse de son sens de marche.  V\u00e9rifiez les sens de la voie autour d\u2019eux dans l\u2019\u00e9diteur d\u2019autonomie avant de d\u00e9marrer l\u2019autonomie, puis retournez chaque train d\u2019un clic droit.
autosetup.ui.directionsCarried=Le sens unique de l\u2019ancien fichier a \u00e9t\u00e9 report\u00e9 sur {0} tron\u00e7ons de voie que le plan laissait \u00e0 leur r\u00e9glage par d\u00e9faut.  Les sens que vous aviez fix\u00e9s vous-m\u00eame ont \u00e9t\u00e9 conserv\u00e9s.  V\u00e9rifiez-les sur le plan avant de d\u00e9marrer l\u2019autonomie.
autosetup.ui.directionsNotCarried=L\u2019ancien fichier parcourait {0} tron\u00e7ons de voie dans un seul sens, ce que le plan ne fait pas.  Ils ont \u00e9t\u00e9 laiss\u00e9s tels que le plan les a, car ses sens ont d\u00e9j\u00e0 \u00e9t\u00e9 fix\u00e9s.  V\u00e9rifiez-les sur le plan si les trains doivent circuler comme dans l\u2019ancienne version.
autosetup.ui.leftModernFields={0} cases portaient des r\u00e9glages que l\u2019ancien format ne connaissait pas - ce fichier ressemble donc \u00e0 un export de cette version plut\u00f4t qu\u2019\u00e0 un ancien fichier.  Un import par cette voie ne conserve que ce que l\u2019ancien format savait exprimer et abandonne le reste.  Si c\u2019est le cas, chargez la configuration au lieu de l\u2019importer.
autosetup.ui.leftRouteActivations=Les activations d\u2019itin\u00e9raires.  Les reprendre activerait et d\u00e9sactiverait des itin\u00e9raires sur le r\u00e9seau r\u00e9el \u00e0 chaque chargement.
autosetup.ui.leftTimetable=Un horaire de {0} entr\u00e9es.  Ses points sont appari\u00e9s par r\u00e9trosignal, et un r\u00e9trosignal partag\u00e9 ne peut pas dire quelle case \u00e9tait vis\u00e9e.
autosetup.ui.infoLegacyUnknownLocs=Non plac\u00e9es, car aucune locomotive de ce nom n\u2019est dans la base de donn\u00e9es : {0}. Ajoutez-les ou renommez-les, puis importez \u00e0 nouveau.
