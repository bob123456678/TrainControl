route.ui.frameLogicDisagrees=Une partie de la logique est en rouge: deux mots diff\u00e9rents au m\u00eame niveau veulent dire deux choses diff\u00e9rentes. Indentez les conditions \u00e0 grouper, ou uniformisez les mots.
route.ui.conditionWordDisagrees=Ce mot diff\u00e8re du mot qui relie d\u00e9j\u00e0 ce niveau, la condition peut donc se lire de deux fa\u00e7ons. Indentez les conditions \u00e0 grouper, ou utilisez le m\u00eame mot.
route.ui.conditionWordJoinsNothing=Ce mot est plus indent\u00e9 que la condition voisine : il ne relie rien et serait ignor\u00e9. Indentez aussi les conditions des deux c\u00f4t\u00e9s, ou d\u00e9sindentez ce mot.
