autolayout.ui.confirmClearAllHomeLocomotives=Toutes les affectations de locomotive seront effac\u00e9es. \nLe retour au d\u00e9part renverra alors chaque locomotive l\u00e0 o\u00f9 elle se trouvait au chargement du fonctionnement autonome. Confirmer ?
