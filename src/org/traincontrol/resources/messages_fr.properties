autosetup.ui.errorTrainLengthOutOfRange=Une longueur de train est un nombre entier de 1 \u00e0 {0}.  0 signifie que le train n\u2019a pas de longueur, ce qu\u2019il a d\u00e9j\u00e0.  Saisissez une longueur, ou appuyez sur Passer.
