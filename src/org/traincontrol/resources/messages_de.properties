autosetup.ui.promptTileLength=Wie lang soll dieses Gleisst\u00fcck z\u00e4hlen? L\u00e4ngen sind Ihre eigenen Einheiten, werden entlang einer Fahrt aufsummiert und mit Zugl\u00e4ngen verglichen. 0 bedeutet, dass es nicht mitz\u00e4hlt.
