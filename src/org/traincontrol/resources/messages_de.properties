layout.ui.absentPageQuestion=TrainControl kann diese Seiten nicht sehen, das Gleisbild-Verzeichnis fuehrt sie aber weiterhin auf:{0}\n\nWenn sie nur voruebergehend fehlen - noch nicht synchronisiert oder in einem anderen Programm geoeffnet -, behalten Sie sie.  Ihre Autonomie-Einstellungen bleiben zugeordnet und kehren mit der Seite zurueck.\n\nWurden sie geloescht, koennen ihre Einstellungen nie wieder zugeordnet werden und lassen die Setup-Datei nur weiter wachsen.
