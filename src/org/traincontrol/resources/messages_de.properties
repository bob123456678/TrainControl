route.ui.titleDiscardChanges=Ungespeicherte \u00c4nderungen
route.ui.frameLockedExplains=Diese Fahrstra\u00dfe geh\u00f6rt der Central Station. \u00c4ndern Sie sie dort und synchronisieren Sie erneut.
route.ui.frameHelp=Eine Fahrstra\u00dfe tut zwei Dinge: sie arbeitet die Befehle oben der Reihe nach ab, und sie kann zur\u00fcckgehalten werden, bis die Anlage in einem bestimmten Zustand ist.\n\nBEFEHLE\n\nJede Zeile ist eine Handlung - eine Weiche stellen, ein Signal setzen, eine andere Fahrstra\u00dfe ausl\u00f6sen. Die Reihenfolge IST die Fahrstra\u00dfe. Die Spalte Verz\u00f6gerung h\u00e4lt den n\u00e4chsten Befehl zur\u00fcck, bis ein langsamer Antrieb fertig ist.\n\nEine Dreiwegweiche ist eine einzige Zeile. Sie besteht in Wirklichkeit aus zwei Antrieben auf aufeinanderfolgenden Adressen, und die Zeile schreibt beide Befehle in der n\u00f6tigen Reihenfolge, mit einer Pause dazwischen.\n\nBEDINGUNGEN\n\nDie Fahrstra\u00dfe wartet, bis diese zutreffen, bevor sie SICH SELBST ausl\u00f6st - \u00fcber ihren S88-Ausl\u00f6ser. Von Hand gestartet, \u00fcber die Start-Schaltfl\u00e4che, das Kontextmen\u00fc oder ein Fahrstra\u00dfen-Feld im Gleisbild, l\u00e4uft sie unabh\u00e4ngig von den Bedingungen: Sie sehen die Anlage, die Bedingung nicht. Jede Zeile ist eine Tatsache, und die und/oder-Zeile zwischen zwei Zeilen sagt, wie sie verkn\u00fcpft sind.\n\nZeilen einr\u00fccken, um sie zu verschachteln. Alles auf einer Einr\u00fcckungsebene ist eine Gruppe, und das Wort auf dieser Ebene verkn\u00fcpft sie. Alle W\u00f6rter einer Ebene m\u00fcssen dasselbe Wort sein; ein abweichendes wird rot angezeigt. Darunter steht, was das Ganze in Worten bedeutet.\n\nTest liest die Sensoren im jetzigen Zustand und sagt, ob die Fahrstra\u00dfe ausl\u00f6sen w\u00fcrde.\n\nOhne Bedingungen l\u00f6st die Fahrstra\u00dfe immer aus, wenn sie getriggert wird.
