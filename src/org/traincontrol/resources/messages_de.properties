autosetup.ui.warnPageRenumbered=Die Seite "{0}" scheint umnummeriert worden zu sein, und diese Nummer geh\u00f6rt jetzt zu "{1}". Ihre Autonomie-Einstellungen wurden \u00fcber den Seitennamen zugeordnet und am richtigen Gleis \u00fcbernommen.  Solange dies besteht, wird nichts aufger\u00e4umt - auch nicht beim Speichern - denn ein Feld, das zu fehlen scheint, kann nur eines mit verschobener Seitennummer sein.  Speichern Sie das Setup, um die neue Nummerierung zu erfassen; der Hinweis verschwindet beim n\u00e4chsten Laden.
