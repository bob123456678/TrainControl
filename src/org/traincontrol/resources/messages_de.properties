autosetup.ui.infoImported=Importiert. {0} Stationsnamen, L\u00e4ngen und andere Gleiseinstellungen wurden aus der Datei \u00fcbernommen, um L\u00fccken in dieser Einrichtung zu f\u00fcllen.
autosetup.ui.infoPagesExcludedForSensors={0} Seite(n) aus der Autonomie herausgenommen, weil sie R\u00fcckmelde-Adressen wiederholen, die bereits von einer fr\u00fcheren Seite genutzt werden: {1}. Zwei Felder mit derselben Adresse lassen sich nicht unterscheiden, daher wird die fr\u00fchere Seite beibehalten. Sie k\u00f6nnen jede Seite \u00fcber den Autonomie-Editor wieder einschalten.
autosetup.ui.infoLegacyImported={0} Felder benannt, {1} Lokomotiven platziert, {2} als wendende Z\u00fcge markiert und {3} weitere Einstellungen \u00fcbernommen. {4} Felder hatten bereits einen Namen und wurden unver\u00e4ndert gelassen. {5} Punkte konnten keinem R\u00fcckmelder in diesem Gleisbild zugeordnet werden.
autosetup.ui.leftBehind={0} Dinge in der Datei wurden bewusst nicht importiert.  Das Protokoll listet sie auf.
autosetup.ui.leftBehindHeading=Dieser Import hat Folgendes bewusst ausgelassen.  Es steht weiterhin in der gelesenen Datei, die unver\u00e4ndert bleibt:
autosetup.ui.leftEdgeCommands={0} Verbindungen hatten Zubeh\u00f6rbefehle.  Befehle werden jetzt aus dem Gleisbild abgeleitet und daher nicht \u00fcbernommen.
autosetup.ui.leftEdgeLengths={0} Verbindungen hatten eine L\u00e4nge.  L\u00e4ngen geh\u00f6ren jetzt zu Feldern, und eine L\u00e4nge pro Verbindung l\u00e4sst sich nicht aufteilen.
autosetup.ui.leftEdgeLocks={0} Verbindungen sperrten andere Verbindungen von Hand.  Sperren werden jetzt aus dem Gleisbild abgeleitet - zwei Verbindungen, die ein Feld teilen, sperren einander - eine von Hand gesetzte Sperre zwischen Verbindungen ohne gemeinsames Feld wird also nicht \u00fcbernommen.  Pr\u00fcfen Sie jede Stelle, an der sich zwei Z\u00fcge nicht gleichzeitig bewegen d\u00fcrfen, obwohl sich die Gleise nicht ber\u00fchren.
autosetup.ui.leftSignalAuthors={0} Signale wurden in Ihrer alten Einrichtung von Hand geschaltet (Nummern {1}).  Signale werden jetzt nur dort gestellt, wo Sie eines mit einer Station verbinden, \u00fcber das Men\u00fc dieser Station.  Pr\u00fcfen Sie jedes davon: nicht verbundene Signale bleiben einfach gr\u00fcn.
autosetup.ui.facingsGuessed=Bei {0} Z\u00fcgen wurde die Fahrtrichtung gew\u00e4hlt, da die alte Datei nicht zeigt, in welche Richtung sie gefahren sind.  \u00dcberpr\u00fcfen Sie jeden im Gleisbild und wenden Sie falsch ausgerichtete Z\u00fcge \u00fcber ihr Rechtsklickmen\u00fc im Autonomie-Editor, bevor Sie die Automatik starten.
autosetup.ui.facingsNotHeld=Die alte Datei lie\u00df die Z\u00fcge bei {0} in einer Richtung fahren, in der dieses Gleisbild keine Ankunft zul\u00e4sst, deshalb wurde jeder so aufgestellt, wie sein Feld es allein erlaubt - andersherum, als er f\u00e4hrt.  Pr\u00fcfen Sie die Richtungen auf dem Gleis um sie herum im Autonomie-Editor, bevor Sie die Automatik starten, und wenden Sie dann jeden Zug dort per Rechtsklick.
autosetup.ui.directionsCarried=Der Einrichtungsbetrieb der alten Datei wurde auf {0} Gleisst\u00fccke \u00fcbertragen, die im Gleisbild noch ihre Voreinstellung hatten.  Selbst gesetzte Richtungen blieben erhalten.  Pr\u00fcfen Sie sie im Gleisbild, bevor Sie die Automatik starten.
autosetup.ui.directionsNotCarried=Die alte Datei befuhr {0} Gleisst\u00fccke nur in einer Richtung, die das Gleisbild nicht so f\u00fchrt.  Sie blieben, wie das Gleisbild sie hat, weil seine Richtungen bereits gesetzt sind.  Pr\u00fcfen Sie sie im Gleisbild, wenn Z\u00fcge so fahren sollen wie in der alten Version.
autosetup.ui.autoLoadOffAfterImport={0} > {1} wurde abgew\u00e4hlt, wie nach jedem Import einer alten autonomy.json.  W\u00e4hlen Sie es an, um diese Einrichtung beim Start von TrainControl zu laden.
autosetup.ui.leftModernFields={0} Felder trugen Einstellungen, die es im alten Format nie gab - diese Datei sieht also nach einem Export aus dieser Version aus und nicht nach einer \u00e4lteren Datei.  Ein Import auf diesem Weg beh\u00e4lt nur, was das alte Format ausdr\u00fccken konnte, und verwirft den Rest.  Wenn das zutrifft, laden Sie das Setup, statt es zu importieren.
autosetup.ui.leftRouteActivations=Routen-Aktivierungen.  Diese zu \u00fcbernehmen w\u00fcrde bei jedem Laden der Einrichtung Routen auf der echten Anlage ein- und ausschalten.
autosetup.ui.leftTimetable=Ein Fahrplan mit {0} Eintr\u00e4gen.  Seine Punkte werden \u00fcber R\u00fcckmelder zugeordnet, und ein von mehreren Feldern geteilter R\u00fcckmelder kann nicht sagen, welches gemeint war.
autosetup.ui.infoLegacyUnknownLocs=Nicht platziert, weil keine Lokomotive mit diesem Namen in der Datenbank vorhanden ist: {0}. F\u00fcgen Sie sie hinzu oder benennen Sie sie um, und importieren Sie erneut.
