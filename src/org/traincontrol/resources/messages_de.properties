# Untranslated: English text, kept here so the key set matches messages.properties.
# Replace the values as these are translated.
autolayout.errorAutoDestinationInvalidValue=The autoDestination value for point {0} must be true or false.
autosetup.ui.errorScissorsNotSupported=Eine Kreuzungsweiche bei {0} kann von der Autonomie nicht genutzt werden. Sie stellt eine doppelte Kreuzungsweiche dar, die \u00fcber zwei Felder gezeichnet wird, sodass sich der Gleisverlauf durch sie hindurch aus keinem der beiden Felder allein ableiten l\u00e4sst. Ersetzen Sie sie durch gew\u00f6hnliche Weichenfelder, oder nehmen Sie diese Seite aus der Autonomie heraus.
autosetup.ui.errorTileHasNoAddress=Die Weiche oder das Signal bei {0} hat keine digitale Adresse, daher kann TrainControl es nicht stellen. Ein Zug, der dar\u00fcber geschickt wird, m\u00fcsste sich darauf verlassen, dass es bereits richtig steht. Geben Sie ihm eine Adresse, oder nehmen Sie diese Seite aus der Autonomie heraus.
autosetup.ui.errorAdjacentRouteTiles={0}: Zwei Routentasten liegen nebeneinander, w\u00e4hrend Gleis in sie hineinf\u00fchrt - das Paar leitet eine Fahrstra\u00dfe \u00fcber Bildfl\u00e4che ohne Gleis.  Eine davon vom Gleis wegr\u00fccken.
autosetup.ui.errorRouteTileThreeWay={0}: Gleis f\u00fchrt von drei Seiten in diese Routentaste.  Sie kann nur eine Fahrstra\u00dfe durchleiten, die dritte entf\u00e4llt - die Verzweigung auf eine Weiche legen statt auf eine Taste.
autosetup.ui.errorLinkNotMutuallyPaired=Die Verbindung bei {0} ist nicht mit einer Verbindung verkn\u00fcpft, die auf sie zur\u00fcckverweist. Jede Verbindung darf nur genau einen Partner nennen, und dieser Partner muss sie umgekehrt ebenfalls nennen - sonst k\u00f6nnte ein Zug hin\u00fcberfahren und nicht mehr zur\u00fcckkommen.
autosetup.ui.warnLinkNeverPaired=Die Verbindung bei {0} wurde mit nichts verkn\u00fcpft, daher f\u00fchrt sie ins Leere: Das Gleis, das zu ihr hinf\u00fchrt, endet dort, und das, worauf sie weiterf\u00fchren sollte, kann auf diesem Weg nicht erreicht werden. Klicken Sie sie mit der rechten Maustaste an, um sie zu verkn\u00fcpfen, oder schalten Sie sie aus, damit sie nicht erneut gemeldet wird.
autosetup.ui.warnLinkNeverPairedUnreachable=Die Verbindung bei {0} wurde nicht verkn\u00fcpft, aber es f\u00fchrt auch kein Gleis zu ihr hin - sie kann also ohnehin nicht erreicht werden. Verkn\u00fcpfen Sie sie, falls sie irgendwohin f\u00fchren sollte, oder lassen Sie sie aus der Autonomie heraus.
autosetup.ui.warnLinkToExcludedPage=Die Verbindung bei {0} zeigt auf eine Seite, die nicht zur Autonomie geh\u00f6rt, daher gibt es nichts, womit sie verkn\u00fcpft werden k\u00f6nnte: das Gleis, das zu ihr f\u00fchrt, endet dort. Beziehen Sie diese Seite in die Autonomie ein, wenn die Route wichtig ist, oder schalten Sie die Verbindung ab, damit sie nicht erneut gemeldet wird.
autosetup.ui.errorNotANumber="{0}" ist keine ganze Zahl, daher wurde nichts ge\u00e4ndert.
autosetup.ui.errorLabelWriteFailed=Stationsnamen, die fr\u00fcher im Gleisbild gespeichert wurden, werden jetzt zusammen mit der Autonomie-Einrichtung verwaltet, aber diese Seiten konnten nicht neu geschrieben werden, um die alten Kopien zu entfernen: {0}. Es ist nichts verloren gegangen, und TrainControl versucht es beim n\u00e4chsten Start erneut.
autosetup.ui.errorEditorAlreadyOpen=F\u00fcr dieses Gleisbild ist bereits ein Editor ge\u00f6ffnet. Schlie\u00dfen Sie ihn, bevor Sie einen weiteren \u00f6ffnen - zwei davon teilen sich ein Gleisbild, und jeder w\u00fcrde die \u00c4nderungen des anderen r\u00fcckg\u00e4ngig machen.
autosetup.ui.errorNoSetupToEdit=Die Autonomie-Einrichtung kann f\u00fcr dieses Gleisbild nicht ge\u00f6ffnet werden.\n\nDaf\u00fcr wird ein lokaler Gleisbild-Ordner ben\u00f6tigt, in den TrainControl schreiben kann.
autosetup.ui.confirmExitWithoutSaving=Autonomie-Editor schlie\u00dfen und alles verwerfen, was seit dem letzten Speichern ge\u00e4ndert wurde?\n\nDas schlie\u00dft auch alle Stationsnamen ein, die Sie in diesem Fenster auf das Gleisbild gesetzt haben.
autosetup.ui.confirmJumpWithUnsavedEdits=Zum anderen Ende dieser Verbindung springen?\n\nDieses Fenster wird geschlossen und auf jener Seite neu ge\u00f6ffnet. Nichts geht verloren - alle Ihre \u00c4nderungen bleiben erhalten -, aber sie wurden noch nicht gespeichert.
autosetup.ui.errorDiscardFailed=Die \u00c4nderungen konnten nicht verworfen werden, weil die gespeicherte Einrichtung nicht zur\u00fcckgelesen werden konnte: {0}. Der Editor wurde ge\u00f6ffnet gelassen, damit nichts verloren geht.
autosetup.ui.menuFacingGroup={0} steht in Richtung...
autosetup.ui.hintFacing=In welche Richtung der Zug steht. Zwei Gleise f\u00fchren zu diesem Feld, ein Zug k\u00f6nnte also \u00fcber beide angekommen sein, und wohin er zeigt, entscheidet, wohin er als N\u00e4chstes fahren kann - ein Zug kann nicht r\u00fcckw\u00e4rts losfahren. Lassen Sie es unver\u00e4ndert, wenn Sie sich nicht sicher sind: Die Autonomie korrigiert es, sobald der Zug das erste Mal f\u00e4hrt.
autosetup.ui.facingN=Norden (im Gleisbild nach oben)
autosetup.ui.facingE=Osten (rechts)
autosetup.ui.facingS=S\u00fcden (nach unten)
autosetup.ui.facingW=Westen (links)
autosetup.ui.menuUseLink=Autonomie nutzt diese Verbindung
autosetup.ui.hintUseLink=Schalten Sie dies f\u00fcr eine Verbindung aus, die nur der Zeichnung dient und nicht zur Eisenbahn geh\u00f6rt, auf der die Autonomie f\u00e4hrt. Sie bef\u00f6rdert dann keine Z\u00fcge und wird nicht als unverkn\u00fcpft gemeldet.
autosetup.ui.errorPortalTargetsExcludedPage=Die Verbindung bei {0} verweist auf eine Seite, die aus der Autonomie ausgeschlossen ist. Verkn\u00fcpfen Sie sie entweder mit einer Verbindung auf einer von der Autonomie genutzten Seite, oder lassen Sie sie unverkn\u00fcpft, damit kein Zug versucht, sie zu \u00fcberqueren.
autosetup.ui.warnTurntableNotRoutable=Die Autonomie h\u00e4lt an der Drehscheibe bei {0} an und f\u00e4hrt keine Z\u00fcge \u00fcber sie hinweg. Der Rest des Gleisbilds ist davon nicht betroffen.
autosetup.ui.warnPermanentTurnout=Die Weiche bei {0} ist als adresslos markiert, daher d\u00fcrfen Z\u00fcge sie nur in trailender Richtung befahren, bei der die Stellung der Zungen keine Rolle spielt.
autosetup.ui.errorCompanionVersion=Diese Autonomie-Einrichtung wurde von einer neueren Version von TrainControl geschrieben und kann nicht gelesen werden. Aktualisieren Sie TrainControl, oder verschieben Sie die Dateien in config/autonomy, um neu zu beginnen.
autosetup.ui.errorDeleteConfigurationFailed={0} konnte nicht gel\u00f6scht werden. Die Datei ist m\u00f6glicherweise in einem anderen Programm ge\u00f6ffnet, wird von einem Sync-Client gehalten oder liegt in einem Ordner, in den dieser Computer nicht schreiben kann.
autosetup.ui.errorRenameConfigurationFailed={0} konnte nicht umbenannt werden. Die Datei ist m\u00f6glicherweise in einem anderen Programm ge\u00f6ffnet, wird von einem Sync-Client gehalten oder liegt in einem Ordner, in den dieser Computer nicht schreiben kann. Es wurde nichts ge\u00e4ndert.
autosetup.ui.errorConfigurationUnreadable=Die Autonomie-Konfiguration {0} konnte nicht gelesen werden, daher wurde nichts ge\u00e4ndert: {1}
autosetup.ui.errorAutonomyNeedsLocalLayout=Die Autonomie ben\u00f6tigt eine lokale Kopie des Gleisbilds, da ihre Einstellungen zusammen mit den Gleisbild-Dateien gespeichert werden. Laden Sie das Layout zun\u00e4chst von der Central Station herunter.
autosetup.ui.checkStationReachesNothing=Kein Zug kann {0} in Richtung einer anderen Station verlassen. Pr\u00fcfen Sie die Richtungen der von dort abgehenden Gleise.
autosetup.ui.checkStationUnreachable=Kein Zug kann {0} von einer anderen Station aus erreichen.  Pr\u00fcfen Sie die Richtungen der zuf\u00fchrenden Gleise und ob dort Einfahrten aus der Anfahrtrichtung gesperrt sind.
autosetup.ui.checkTerminusStranded=Ein Zug nach {0} k\u00f6nnte keine andere Station mehr erreichen.  Pr\u00fcfen Sie die Richtungen der abgehenden Gleise und ob dort Einfahrten aus der Abfahrtrichtung gesperrt sind.
autosetup.ui.checkPointIsolated=Nichts ist mit {0} verbunden, daher wird niemals ein Zug daran vorbeifahren. Das Gleis dort ist gezeichnet, aber jede Verbindung dazu wurde geschlossen.
autosetup.ui.checkRunClosedBothWays=Das Gleis bei {0} ist in beide Richtungen gesperrt, daher kann nichts daran vorbeifahren. Das ist meist ein Versehen beim Einrichten der Einbahnfahrt.
autosetup.ui.checkNoStations=Es wurde noch keine Station festgelegt, daher hat die Autonomie kein Ziel, an das sie einen Zug schicken k\u00f6nnte. Markieren Sie mindestens zwei R\u00fcckmelder als Station.
autosetup.ui.checkOneStation={0} ist die einzige Station, daher hat die Autonomie kein weiteres Ziel f\u00fcr einen Zug. Legen Sie mindestens eine weitere fest.
autosetup.ui.checkUnnamedPoint=Der R\u00fcckmelder bei {0} tr\u00e4gt noch den automatisch vergebenen Namen. Z\u00fcge fahren daran vorbei, statt dort zu halten, daher ist das eher eine Sache zum Aufr\u00e4umen als dringend - aber unter diesem Namen wird eine Fahrt hier durchgef\u00fchrt.
autosetup.ui.checkMayTurnOnDeadEnd={0} ist auf "Z\u00fcge d\u00fcrfen hier die Richtung wechseln" gesetzt, aber kein ankommender Zug kann weiterfahren - jede Zufahrt f\u00fchrt nur wieder zur\u00fcck, also wenden ohnehin alle.  "Muss" sagt dasselbe deutlicher.
autosetup.ui.checkReversingLeadsNowhere=Zuege wenden an {0}, aber von dort ist kein Bahnhof erreichbar - ein Zug wuerde also wenden und haette immer noch kein Ziel. Falls die Weiterfahrt offen sein sollte, ist dies das Gleis, das zu pruefen ist.
autosetup.ui.checkCaptionCovered=Der Name von {0} ist nicht zu sehen: Auf dem Feld, auf dem seine Beschriftung liegt, steht auch eigener Text, und dieser Text wird angezeigt. Verschieben Sie die Beschriftung auf ein freies Feld, oder l\u00f6schen Sie den Text.
autosetup.ui.checkHomeNeedsReversible=Das Zuhause bei {0} kann nur von einer Lokomotive genutzt werden, die die Richtung wechseln kann. Jeder Zug muss auf diesem Feld wenden, daher wird ein Zug, der das nicht kann, nie hierher nach Hause geschickt.
autosetup.ui.checkReversalNeedsLength=Bei {0} wenden Zuege, und fuer sein Gleis ist keine Laenge hinterlegt - es laesst sich also nicht sagen, ob ein langer Zug ueber der Weiche dahinter stehen wuerde.  Bitte die Gleislaenge eintragen.
autosetup.ui.checkReversalNeedsLengthRun=Bei {0} wenden Zuege, und fuer {2} Felder dort und auf dem Weg dorthin ist keine Laenge hinterlegt - es laesst sich also nicht sagen, ob ein langer Zug ueber der Weiche dahinter stehen wuerde.  Tragen Sie die Gleislaengen ein.
autosetup.ui.checkCopyNoWayOut=Ein Zug, der {0} aus dieser Richtung erreicht, kommt nicht wieder weg - es fuehrt kein Gleis hinaus.  Die Automatik kann ihn trotzdem dorthin schicken.  Bitte einen Ausgang oeffnen oder die Einfahrt aus dieser Richtung sperren.
autosetup.ui.checkCopyNoWayIn={0} ist von dieser Seite nicht erreichbar - es fuehrt kein Gleis hinein.  Ein dort abgestellter Zug wird von der Heimfahrt nicht bewegt und blockiert alles dahinter.
autosetup.ui.checkCopyReachesNothing=Ein Zug, der {0} aus dieser Richtung erreicht, kommt nicht weiter - von dort ist kein anderer Bahnhof erreichbar.  Er kann zwar ausfahren, aber jeder Weg fuehrt wieder dorthin zurueck.  Die Automatik kann ihn trotzdem dorthin schicken.  Bitte eine Weiterfahrt oeffnen oder die Einfahrt aus dieser Richtung sperren.
autosetup.ui.checkProtectingSignalGone=Ein mit {0} verkn\u00fcpftes Signal ist auf diesem Gleisbild nicht mehr vorhanden, daher ist dieser Bahnsteig nicht mehr vollst\u00e4ndig gesichert. Verkn\u00fcpfen Sie es mit einem anderen Signal, oder entfernen Sie die Verkn\u00fcpfung.
autosetup.ui.checkFacingImpossible={0} hat eine Lokomotive gespeichert, die in eine Richtung zeigt, die dieses Feld nicht mehr zul\u00e4sst - das Gleis drumherum hat sich seither ge\u00e4ndert. Die Autonomie stellt sie in die zuerst m\u00f6gliche Richtung, was auch die andere sein kann. Stellen Sie die Richtung \u00fcber das Kontextmen\u00fc ein.
autosetup.ui.checkNoProtectingSignal={0} ist kein Signal zugeordnet.
autosetup.ui.checkDuplicateLocomotive={0} hat eine Lokomotive stehen, die auch anderswo als stehend gespeichert ist. Eine Lokomotive kann nur an einem Ort sein, und die Autonomie verweigert die gesamte Einrichtung, solange sie an zweien steht - entfernen Sie sie also von dem Feld, auf dem sie nicht steht.
autosetup.ui.checkNoTrainLength={1} bei {0} hat keine Zugl\u00e4nge, wird also nie wegen \u00dcberl\u00e4nge an einem Bahnsteig abgewiesen.
autosetup.ui.checkNoMaxTrainLength={0} hat keine maximale Zugl\u00e4nge; kein Zug ist hier je zu lang.
autosetup.ui.checkDuplicateSensorPage={1}, daher steht ein Melder f\u00fcr zwei Orte und kein Zug darauf ist zu orten.  Schalten Sie eine der Seiten ab, oder geben Sie einem der beiden Felder einen eigenen Melder.
autosetup.ui.duplicateSensorSubject=Der Melder s88 {0} liegt auf Seite \u201e{1}\u201c und auch auf Seite \u201e{2}\u201c
autosetup.ui.checkArrivalTrapped=Ein Zug, der {0} aus mindestens einer Richtung erreicht, k\u00f6nnte nicht weiterfahren: Das einzige Gleis vor ihm ist das, \u00fcber das er gerade gekommen ist, und ein Zug kann hier nicht wenden. Setzen Sie entweder "Z\u00fcge d\u00fcrfen hier die Richtung wechseln", oder \u00f6ffnen Sie den Weg voraus.
autosetup.ui.checkUnnamedStation=Die Station bei {0} tr\u00e4gt noch den automatisch vergebenen Namen. Unter diesem Namen wird sie ausgew\u00e4hlt und Ank\u00fcnfte werden angesagt, geben Sie ihr also einen, den Sie auch laut aussprechen w\u00fcrden.
autosetup.ui.checkUnlabelledStation={0} wird nirgends im Gleisbild angezeigt, daher sehen Sie sie nicht, w\u00e4hrend Z\u00fcge fahren. Klicken Sie im Einrichtungs-Editor mit der rechten Maustaste auf ein Textfeld, um den Namen dort einzutragen.
