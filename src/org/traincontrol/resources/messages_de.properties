autosetup.ui.whyBlockedBySetup=Diese Einrichtung hat {0} blockierende(n) Befund(e), daher l\u00e4sst sich der gr\u00f6\u00dfte Teil der Eisenbahn \u00fcberhaupt nicht befahren - eine Weiche oder ein Signal ohne Adresse unterbricht jede Fahrt hindurch. Beheben Sie diese zuerst: Die Antworten unten beziehen sich auf die verbliebenen Fragmente.
