route.ui.frameLogicDisagrees=Ein Teil der Logik ist rot markiert: zwei verschiedene W\u00f6rter auf derselben Ebene bedeuten zwei verschiedene Dinge. R\u00fccken Sie die Bedingungen ein, die Sie gruppieren wollten, oder gleichen Sie die W\u00f6rter an.
route.ui.conditionWordDisagrees=Dieses Wort unterscheidet sich vom Wort, das diese Ebene bereits verbindet, daher kann die Bedingung auf zwei Arten gelesen werden. R\u00fccken Sie die Bedingungen ein, die Sie gruppieren wollten, oder verwenden Sie dasselbe Wort.
route.ui.conditionWordJoinsNothing=Dieses Wort ist weiter einger\u00fcckt als die Bedingung daneben, verbindet also nichts und w\u00fcrde weggelassen. R\u00fccken Sie auch die Bedingungen auf beiden Seiten ein, oder r\u00fccken Sie das Wort wieder aus.
route.ui.frameLockedTitle={0} - von der Central Station, hier nicht \u00e4nderbar
