autosetup.ui.labelPointNotStation=Nur ein R\u00fcckmelder kann eine Station sein, denn ohne ihn hat die Autonomie keine M\u00f6glichkeit zu erkennen, dass ein Zug angekommen ist. W\u00e4hlen Sie ein R\u00fcckmeldefeld.
