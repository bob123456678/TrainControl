route.ui.frameHelp=Una ruta hace dos cosas: ejecuta los comandos de arriba en orden, y puede retenerse hasta que la maqueta est\u00e9 en un estado concreto.\n\nCOMANDOS\n\nCada fila es una acci\u00f3n: mover un desv\u00edo, poner una se\u00f1al, lanzar otra ruta. El orden ES la ruta. La columna de retardo retiene el comando siguiente mientras un motor lento termina.\n\nUn desv\u00edo de tres v\u00edas es una sola fila. En realidad son dos motores en direcciones consecutivas, y la fila escribe ambos comandos en el orden en que deben enviarse, con una pausa entre ellos.\n\nCONDICIONES\n\nLa ruta espera a que se cumplan. Cada fila es un hecho, y la l\u00ednea y/o entre dos filas dice c\u00f3mo se combinan.\n\nSangra una fila para anidarla. Todo lo que est\u00e1 al mismo nivel de sangr\u00eda es un grupo, y la palabra de ese nivel lo une. Todas las palabras de un nivel deben ser la misma; la que discrepa se muestra en rojo. Debajo ver\u00e1s lo que significa todo en palabras.\n\nProbar lee los sensores tal como est\u00e1n ahora y dice si la ruta se activar\u00eda.\n\nDeja las condiciones vac\u00edas y la ruta se activa siempre que se dispara.
