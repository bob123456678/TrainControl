autosetup.ui.errorTrainLengthOutOfRange=Una longitud de tren es un n\u00famero entero de 1 a {0}.  0 significa que el tren no tiene longitud, que es lo que tiene ahora.  Introduzca una longitud, o pulse Omitir.
