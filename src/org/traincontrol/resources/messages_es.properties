autosetup.ui.infoGraphExported=El grafo derivado se ha escrito en {0}, en la carpeta que est\u00e1 a punto de abrirse.\n\nEsto es un diagn\u00f3stico: es a lo que se compila el diagrama, no un archivo con el que trabaja la autonom\u00eda.
