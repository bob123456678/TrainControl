route.ui.helpMessage=Los itinerarios son simplemente una serie de \u00f3rdenes que se ejecutan una tras otra. Usa el asistente hasta que te sientas c\u00f3modo escribiendo las \u00f3rdenes.\n\nEn el campo \u00d3rdenes del itinerario, introduce una orden por l\u00ednea: el nombre del accesorio y su estado, separados por una coma. Por ejemplo: Switch 20,turn o Signal 21,green. Tambi\u00e9n puedes omitir el tipo de accesorio: 20,straight o 21,red. A\u00fan m\u00e1s breve: sustituye turn/red por 1 y straight/green por 0. Un tercer n\u00famero opcional indica un retardo antes de la ejecuci\u00f3n, en milisegundos.\n\nSi quieres que el itinerario se ejecute autom\u00e1ticamente, indica la direcci\u00f3n de un sensor S88 de activaci\u00f3n y pon Ejecuci\u00f3n autom\u00e1tica en "Encendido".\n\nLas condiciones opcionales permiten definir una l\u00f3gica basada en sensores S88 o estados de accesorios (con el mismo formato indicado arriba) que tambi\u00e9n debe cumplirse para que el itinerario se ejecute autom\u00e1ticamente. Se admite l\u00f3gica booleana con OR, AND y par\u00e9ntesis. Por ejemplo, si la direcci\u00f3n S88 de activaci\u00f3n es 10 y la condici\u00f3n S88 es "Feedback 11,0", el itinerario solo se activar\u00e1 si el S88 11 est\u00e1 libre en el momento en que se activa el S88 10.\n\nAdem\u00e1s de los accesorios, las \u00f3rdenes del itinerario tambi\u00e9n pueden referirse a otros itinerarios o a la velocidad, el sentido de marcha y las funciones de una locomotora:\nlocspeed,Nombre de la locomotora,50 (fija la velocidad en 50)\nlocspeed,Nombre de la locomotora,-1 (parada inmediata)\nlocdir,Nombre de la locomotora,forward (o backward)\nlocfunc,Nombre de la locomotora,20,1 (conmuta F20).
