autosetup.ui.warnPageRenumbered=La p\u00e1gina \u00ab{0}\u00bb parece haber sido renumerada, y ese n\u00famero pertenece ahora a \u00ab{1}\u00bb. Sus ajustes de autonom\u00eda se han emparejado por el nombre de la p\u00e1gina y se han aplicado a la v\u00eda correcta.  No se depura nada mientras esto persista, ni siquiera al guardar, porque un cuadro que parece ausente puede ser solo uno cuyo n\u00famero de p\u00e1gina ha cambiado.  Guarde la configuraci\u00f3n para registrar la nueva numeraci\u00f3n; el aviso desaparecer\u00e1 en la pr\u00f3xima carga.
autosetup.ui.warnQuotesStrippedFromName=Las comillas se eliminan de los nombres, as\u00ed que este se guardar\u00e1 sin ellas.
