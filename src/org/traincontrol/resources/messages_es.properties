autosetup.ui.errorImportUnrecognised=Ese archivo no es una configuraci\u00f3n de autonom\u00eda. Elija una configuraci\u00f3n exportada desde TrainControl, o un autonomy.json de una versi\u00f3n anterior.
autosetup.ui.infoImported=Importado. Se han tra\u00eddo del archivo {0} nombres de estaci\u00f3n, longitudes y otros ajustes de v\u00eda para llenar huecos en esta configuraci\u00f3n.
autosetup.ui.infoPagesExcludedForSensors=Se dejaron {0} p\u00e1gina(s) fuera de la autonom\u00eda porque repiten direcciones de retroalimentaci\u00f3n ya usadas por una p\u00e1gina anterior: {1}. Dos casillas con la misma direcci\u00f3n no se pueden distinguir, as\u00ed que se conserva la p\u00e1gina anterior. Puede reactivar cualquier p\u00e1gina desde el editor de autonom\u00eda.
autosetup.ui.infoLegacyImported=Se nombraron {0} casillas, se colocaron {1} locomotoras, se marcaron {2} como trenes que dan la vuelta y se trajeron {3} otros ajustes. {4} casillas ya ten\u00edan nombre y se dejaron como estaban. {5} puntos no se pudieron asociar con un sensor de este diagrama.
autosetup.ui.leftBehind={0} elementos del archivo no se han importado a prop\u00f3sito.  El registro los enumera.
autosetup.ui.leftBehindHeading=Esta importaci\u00f3n ha dejado a prop\u00f3sito lo siguiente.  Sigue en el archivo le\u00eddo, que no se modifica:
autosetup.ui.leftEdgeCommands={0} conexiones llevaban \u00f3rdenes de accesorios.  Las \u00f3rdenes se deducen ahora del plano de v\u00edas, as\u00ed que no se traen.
autosetup.ui.leftEdgeLengths={0} conexiones llevaban una longitud.  Las longitudes pertenecen a las casillas ahora, y una por conexi\u00f3n no puede repartirse.
autosetup.ui.leftEdgeLocks={0} conexiones bloqueaban otras conexiones a mano.  Los bloqueos se deducen ahora del plano de v\u00edas - dos conexiones que comparten una casilla se bloquean entre s\u00ed - por lo que un bloqueo manual entre conexiones sin casilla com\u00fan no se conserva.  Revise cualquier punto donde dos trenes no deban circular a la vez aunque las v\u00edas no se toquen.
autosetup.ui.leftSignalAuthors={0} se\u00f1ales se accionaban a mano en su configuraci\u00f3n anterior (n\u00fameros {1}).  Las se\u00f1ales solo se accionan ahora donde usted asocia una a una estaci\u00f3n, desde el men\u00fa de esa estaci\u00f3n.  Revise cada una: las que no asocie se quedar\u00e1n en verde.
autosetup.ui.facingsGuessed=En {0} trenes se eligi\u00f3 el sentido de marcha, porque el archivo antiguo no muestra en qu\u00e9 sentido circulaban.  Compruebe cada uno en el plano y gire los que est\u00e9n al rev\u00e9s desde su men\u00fa contextual en el editor de autonom\u00eda, antes de iniciar la autonom\u00eda.
autosetup.ui.facingsNotHeld=El archivo antiguo hac\u00eda circular los trenes de {0} en un sentido en el que este plano no permite llegar, as\u00ed que cada uno se coloc\u00f3 en el \u00fanico sentido que permite su casilla, al rev\u00e9s de como circula.  Compruebe los sentidos de la v\u00eda a su alrededor en el editor de autonom\u00eda antes de iniciar la autonom\u00eda, y despu\u00e9s gire cada tren con un clic derecho all\u00ed.
autosetup.ui.leftModernFields={0} casillas ten\u00edan ajustes que el formato antiguo nunca tuvo, as\u00ed que este archivo parece una exportaci\u00f3n de esta versi\u00f3n y no un archivo antiguo.  Importarlo as\u00ed conserva s\u00f3lo lo que el formato antiguo pod\u00eda expresar y descarta el resto.  Si es eso lo que ha pasado, cargue la configuraci\u00f3n en lugar de importarla.
autosetup.ui.leftRouteActivations=Las activaciones de rutas.  Traerlas encender\u00eda y apagar\u00eda rutas en la maqueta real cada vez que se carga.
autosetup.ui.leftTimetable=Un horario de {0} entradas.  Sus puntos se emparejan por sensor, y un sensor compartido no puede decir qu\u00e9 casilla se quer\u00eda.
autosetup.ui.infoLegacyUnknownLocs=No colocadas, porque no hay ninguna locomotora con ese nombre en la base de datos: {0}. A\u00f1\u00e1dalas o ren\u00f3mbrelas, y vuelva a importar.
