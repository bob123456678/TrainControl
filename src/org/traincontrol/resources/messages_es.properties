autolayout.ui.tooltip.pathPreferenceBALANCED_PRIORITY=Elige la estaci\u00f3n que ofrece mayor prioridad por longitud de v\u00eda recorrida, de modo que una estaci\u00f3n cercana sin prioridad puede superar a una lejana muy prioritaria. Es la \u00fanica regla que mira m\u00e1s all\u00e1 del nivel de prioridad m\u00e1s alto. Sin prioridades definidas se comporta como \u00abla v\u00eda m\u00e1s corta\u00bb.
