# Untranslated: English text, kept here so the key set matches messages.properties.
# Replace the values as these are translated.
autolayout.errorAutoDestinationInvalidValue=El valor autoDestination del punto {0} debe ser true o false.
autosetup.ui.errorScissorsNotSupported=Un escape en tijera en {0} no puede usarse con la autonom\u00eda. Es una forma de dibujar un cruce doble en tijera repartido en dos casillas, as\u00ed que la v\u00eda que lo atraviesa no puede deducirse a partir de ninguna de las dos casillas por separado. Sustit\u00fayalo por casillas de desv\u00edo normales, o deje esa p\u00e1gina fuera de la autonom\u00eda.
autosetup.ui.errorTileHasNoAddress=El desv\u00edo o la se\u00f1al en {0} no tiene direcci\u00f3n digital, as\u00ed que TrainControl no puede accionarlo. Un tren enviado sobre \u00e9l confiar\u00eda en que ya est\u00e1 en la posici\u00f3n correcta. As\u00edgnele una direcci\u00f3n, o deje esa p\u00e1gina fuera de la autonom\u00eda.
autosetup.ui.errorAdjacentRouteTiles={0}: dos botones de itinerario est\u00e1n uno junto al otro con v\u00eda que llega hasta ellos, de modo que el par conduce un itinerario por una zona del plano sin ra\u00edles.  Aleje uno de ellos de la v\u00eda.
autosetup.ui.errorRouteTileThreeWay={0}: la v\u00eda llega a este bot\u00f3n de itinerario por tres lados.  Solo puede conducir uno, as\u00ed que el tercero se descarta - dibuje la bifurcaci\u00f3n sobre un desv\u00edo y no sobre un bot\u00f3n.
autosetup.ui.errorLinkNotMutuallyPaired=El enlace en {0} no est\u00e1 emparejado con un enlace que apunte de vuelta hacia \u00e9l. Cada enlace debe indicar exactamente un compa\u00f1ero, y ese compa\u00f1ero debe indicarlo a \u00e9l a su vez, o un tren podr\u00eda cruzar y no poder volver.
autosetup.ui.warnLinkNeverPaired=El enlace en {0} no se ha emparejado con nada, as\u00ed que no lleva a ninguna parte: la v\u00eda que llega a \u00e9l termina ah\u00ed, y aquello a lo que deb\u00eda continuar no se puede alcanzar por este camino. Haga clic derecho para emparejarlo, o desact\u00edvelo para que no se avise de nuevo.
autosetup.ui.warnLinkNeverPairedUnreachable=El enlace en {0} no se ha emparejado, pero tampoco llega ninguna v\u00eda hasta \u00e9l, as\u00ed que nada puede alcanzarlo. Emp\u00e1relo si deb\u00eda llevar a alg\u00fan sitio, o d\u00e9jelo fuera de la autonom\u00eda.
autosetup.ui.warnLinkToExcludedPage=El enlace en {0} apunta a una p\u00e1gina que no forma parte de la autonom\u00eda, as\u00ed que no hay nada con lo que emparejarlo: la v\u00eda que llega hasta \u00e9l termina ah\u00ed. Incluya esa p\u00e1gina en la autonom\u00eda si el itinerario importa, o desactive el enlace para que no vuelva a informarse.
autosetup.ui.errorNotANumber=\u00ab{0}\u00bb no es un n\u00famero entero, as\u00ed que no se ha cambiado nada.
autosetup.ui.errorLabelWriteFailed=Los nombres de estaci\u00f3n que antes se guardaban en el diagrama de v\u00edas ahora se conservan junto con la configuraci\u00f3n de autonom\u00eda, pero estas p\u00e1ginas no se pudieron reescribir para quitar las copias antiguas: {0}. No se ha perdido nada, y TrainControl lo intentar\u00e1 de nuevo la pr\u00f3xima vez que se inicie.
autosetup.ui.errorEditorAlreadyOpen=Ya hay un editor abierto en este diagrama. Ci\u00e9rrelo antes de abrir otro - dos editores comparten el mismo diagrama, y cada uno deshar\u00e1 los cambios del otro.
autosetup.ui.errorNoSetupToEdit=La configuraci\u00f3n de autonom\u00eda no se puede abrir para este diagrama.\n\nNecesita una carpeta de diagrama local en la que TrainControl pueda escribir.
autosetup.ui.confirmExitWithoutSaving=\u00bfCerrar el editor de autonom\u00eda y descartar todo lo cambiado desde el \u00faltimo guardado?\n\nEso incluye cualquier nombre de estaci\u00f3n que haya colocado en el diagrama en esta ventana.
autosetup.ui.errorDiscardFailed=Los cambios no se pudieron descartar, porque la configuraci\u00f3n guardada no se pudo volver a leer: {0}. El editor se ha dejado abierto para que no se pierda nada.
autosetup.ui.menuFacingGroup={0} est\u00e1 orientada hacia...
autosetup.ui.hintFacing=Hacia d\u00f3nde est\u00e1 orientado el tren. Dos v\u00edas llegan a esta casilla, as\u00ed que un tren aqu\u00ed podr\u00eda haber venido por cualquiera de ellas, y hacia d\u00f3nde apunta decide a d\u00f3nde puede ir despu\u00e9s - un tren no puede arrancar marcha atr\u00e1s. D\u00e9jelo tal cual si no est\u00e1 seguro: la autonom\u00eda lo corrige la primera vez que el tren circula.
autosetup.ui.facingOnlyOne=Aqu\u00ed s\u00f3lo es posible un sentido
autosetup.ui.hintFacingOnlyOne=Este cuadro admite una sola orientaci\u00f3n, as\u00ed que un tren aqu\u00ed solo puede apuntar hacia un lado.  Un tren colocado mirando al otro lado se girar\u00eda sin avisar, porque la v\u00eda aqu\u00ed solo permite una.
autosetup.ui.facingN=Norte (hacia arriba en el diagrama)
autosetup.ui.facingE=Este (derecha)
autosetup.ui.facingS=Sur (hacia abajo)
autosetup.ui.facingW=Oeste (izquierda)
autosetup.ui.menuUseLink=La autonom\u00eda usa este enlace
autosetup.ui.hintUseLink=Desactive esto para un enlace que pertenece al dibujo y no a la maqueta por la que circula la autonom\u00eda. Entonces no transporta ning\u00fan tren y no se avisa como no emparejado.
autosetup.ui.errorPortalTargetsExcludedPage=El enlace en {0} apunta a una p\u00e1gina que est\u00e1 fuera de la autonom\u00eda. Emp\u00e1relo con un enlace de una p\u00e1gina usada por la autonom\u00eda, o d\u00e9jelo sin emparejar para que ning\u00fan tren intente cruzarlo.
autosetup.ui.warnTurntableNotRoutable=La autonom\u00eda se detiene en el puente giratorio en {0} y no har\u00e1 circular trenes sobre \u00e9l. El resto de la maqueta no se ve afectado.
autosetup.ui.warnPermanentTurnout=El desv\u00edo en {0} est\u00e1 marcado como sin direcci\u00f3n, as\u00ed que los trenes solo pueden pasarlo en sentido de tal\u00f3n, donde la posici\u00f3n de las agujas no importa.
autosetup.ui.errorCompanionVersion=Esta configuraci\u00f3n de autonom\u00eda fue escrita por una versi\u00f3n m\u00e1s reciente de TrainControl y no se puede leer. Actualice TrainControl, o mueva los archivos de config/autonomy a otro sitio para empezar de nuevo.
autosetup.ui.errorDeleteConfigurationFailed=No se pudo eliminar {0}. El archivo puede estar abierto en otro programa, retenido por un cliente de sincronizaci\u00f3n, o en una carpeta en la que este equipo no puede escribir.
autosetup.ui.errorRenameConfigurationFailed=No se pudo renombrar {0}. El archivo puede estar abierto en otro programa, retenido por un cliente de sincronizaci\u00f3n, o en una carpeta en la que este equipo no puede escribir. No se ha cambiado nada.
autosetup.ui.errorConfigurationUnreadable=La configuraci\u00f3n de autonom\u00eda {0} no se pudo leer, as\u00ed que no se ha cambiado nada: {1}
autosetup.ui.errorAutonomyNeedsLocalLayout=La autonom\u00eda necesita una copia local del diagrama de v\u00edas, porque sus ajustes se guardan junto a los archivos del diagrama. Descargue primero la maqueta desde la Central Station.
autosetup.ui.checkStationReachesNothing=Ning\u00fan tren puede salir de {0} hacia otra estaci\u00f3n. Revise los sentidos de las v\u00edas que salen de ella.
autosetup.ui.checkStationUnreachable=Ning\u00fan tren puede llegar a {0} desde otra estaci\u00f3n.  Revise los sentidos de las v\u00edas que llevan a ella y si se rechazan las llegadas por el lado de acceso.
autosetup.ui.checkTerminusStranded=Un tren enviado a {0} no podr\u00eda llegar a ninguna otra estaci\u00f3n.  Revise los sentidos de las v\u00edas que salen de ella y si se rechazan las llegadas por el lado de salida.
autosetup.ui.checkPointIsolated=Nada est\u00e1 conectado a {0}, as\u00ed que ning\u00fan tren pasar\u00e1 nunca por ella. Su v\u00eda est\u00e1 dibujada, pero toda conexi\u00f3n hacia ella se ha cerrado.
autosetup.ui.checkRunClosedBothWays=La v\u00eda en {0} est\u00e1 cerrada en ambos sentidos, as\u00ed que nada puede pasar por ella. Suele ser un clic err\u00f3neo al configurar la circulaci\u00f3n de sentido \u00fanico.
autosetup.ui.checkNoStations=Todav\u00eda no se ha designado ninguna estaci\u00f3n, as\u00ed que la autonom\u00eda no tiene a d\u00f3nde enviar un tren. Marque al menos dos sensores como estaciones.
autosetup.ui.checkOneStation={0} es la \u00fanica estaci\u00f3n, as\u00ed que la autonom\u00eda no tiene otro sitio donde enviar un tren. Designe al menos una m\u00e1s.
autosetup.ui.checkUnnamedPoint=El sensor en {0} todav\u00eda tiene el nombre que se le asign\u00f3 autom\u00e1ticamente. Los trenes pasan por \u00e9l en vez de detenerse, as\u00ed que esto es m\u00e1s para ordenar que urgente - pero es el nombre con el que se llamar\u00e1 a un trayecto por aqu\u00ed.
autosetup.ui.checkMayTurnOnDeadEnd={0} est\u00e1 configurado como "los trenes pueden cambiar de sentido aqu\u00ed", pero ning\u00fan tren que llegue puede continuar: cada entrada solo lleva de vuelta, as\u00ed que todos dan la vuelta igualmente.  "Debe" lo dice con m\u00e1s claridad.
autosetup.ui.checkReversingLeadsNowhere=Los trenes cambian de sentido en {0}, pero desde ah\u00ed no se puede llegar a ninguna estaci\u00f3n, as\u00ed que un tren enviado all\u00ed dar\u00eda la vuelta y seguir\u00eda sin tener ad\u00f3nde ir. Si la salida deber\u00eda estar abierta, esta es la casilla que hay que mirar.
autosetup.ui.checkCaptionCovered=El nombre de {0} no se puede ver: la casilla sobre la que est\u00e1 dibujado su r\u00f3tulo tambi\u00e9n lleva texto propio, y es su texto el que se muestra. Mueva el r\u00f3tulo a una casilla libre, o borre el texto.
autosetup.ui.checkHomeNeedsReversible=Todo tren tiene que dar la vuelta en la casilla de {0}. Una locomotora que no pueda cambiar de sentido entrar\u00e1 a esta base de morro y habr\u00e1 que sacarla marcha atr\u00e1s a mano.
autosetup.ui.checkReversalNeedsLength=Los trenes invierten la marcha en {0} y su v\u00eda no tiene longitud registrada, as\u00ed que no se puede saber si un tren largo quedar\u00eda sobre el desv\u00edo de detr\u00e1s.  Indique la longitud de la v\u00eda.
autosetup.ui.checkReversalNeedsLengthRun=Los trenes invierten la marcha en {0} y {2} casillas all\u00ed y en el acceso no tienen longitud registrada, as\u00ed que no se puede saber si un tren largo quedar\u00eda sobre el desv\u00edo de detr\u00e1s.  Indique las longitudes de v\u00eda.
autosetup.ui.checkCopyNoWayOut=Un tren que llegue a {0} por ese lado no podr\u00e1 salir: no hay v\u00eda de salida.  La automatizaci\u00f3n a\u00fan puede enviarlo all\u00ed.  Abra una salida o impida la llegada por ese lado.
autosetup.ui.checkCopyNoWayIn=Nada puede llegar a {0}: no hay v\u00eda de entrada.  Un tren dejado all\u00ed no ser\u00e1 movido por el regreso a casa y bloquear\u00e1 todo lo que quede detr\u00e1s.
autosetup.ui.checkCopyReachesNothing=Un tren que llegue a {0} por ese lado no ir\u00e1 m\u00e1s lejos: desde all\u00ed no se puede alcanzar ninguna otra estaci\u00f3n.  Puede salir, pero todos los caminos vuelven al mismo sitio.  La automatizaci\u00f3n a\u00fan puede enviarlo all\u00ed.  Abra una continuaci\u00f3n o impida la llegada por ese lado.
autosetup.ui.checkProtectingSignalGone=Una se\u00f1al emparejada con {0} ya no est\u00e1 en esta maqueta, as\u00ed que ese and\u00e9n no est\u00e1 totalmente protegido. Emp\u00e1rela con otra se\u00f1al, o elimine el emparejamiento.
autosetup.ui.checkFacingImpossible={0} tiene una locomotora registrada como orientada hacia un lado que esta casilla ya no admite - la v\u00eda a su alrededor ha cambiado desde entonces. La autonom\u00eda la colocar\u00e1 orientada hacia el primer sentido que ofrezca la casilla, que puede ser el contrario. Ajuste el sentido desde el men\u00fa contextual.
autosetup.ui.checkNoProtectingSignal={0} no tiene ninguna se\u00f1al asociada.
autosetup.ui.checkGuardIsBoth={1} es a la vez se\u00f1al de entrada y se\u00f1al de salida de {0}.  Una misma se\u00f1al no puede proteger a la vez la entrada y la salida: qu\u00edtela de una de las dos.
autosetup.ui.checkGuardOffTheWayIn={1} protege {0}, pero ning\u00fan camino hacia {0} pasa por ella, as\u00ed que un tren que llega all\u00ed nunca la encuentra.  Compruebe que es la se\u00f1al que quer\u00eda.
autosetup.ui.checkDuplicateLocomotive={0} tiene una locomotora que tambi\u00e9n est\u00e1 registrada como situada en otro sitio. Una locomotora solo puede estar en un lugar, y la autonom\u00eda rechaza toda la configuraci\u00f3n mientras est\u00e9 en dos - qu\u00edtela, pues, de la casilla en la que no est\u00e1.
autosetup.ui.checkNoTrainLength={1} en {0} no tiene longitud definida, por lo que nunca se le negar\u00e1 un and\u00e9n por ser demasiado largo.
autosetup.ui.checkNoMaxTrainLength={0} no tiene longitud m\u00e1xima, por lo que ning\u00fan tren es demasiado largo para ella.
autosetup.ui.checkHalfMeasuredApproach={0} puede rechazar trenes que s\u00ed cabr\u00edan, mientras parte de su acceso est\u00e1 medido y parte no: {1} casillas que llevan a \u00e9l a\u00fan no tienen longitud, y la regla de espacio cuenta como cero una casilla sin medir, por lo que reclama todo el acceso para cualquier tren de longitud conocida.  M\u00eddalas - Asignar longitudes en bloque las recorre - o borre las longitudes de ese acceso.
autosetup.ui.checkRunInShorterThanTheBerth={0} est\u00e1 configurada para un tren de {2}, pero solo hay {3} de v\u00eda medidos entre ella y el desv\u00edo o la inversi\u00f3n que tiene detr\u00e1s, as\u00ed que un tren m\u00e1s largo de {3} ser\u00e1 rechazado aqu\u00ed diga lo que diga el m\u00e1ximo.  Puede ser correcto: un and\u00e9n de {2} puede ser dos tramos a ambos lados de un desv\u00edo.  Si no, falta medir la v\u00eda.
autosetup.ui.checkDuplicateSensorPage={1}, por lo que un sensor representa dos lugares y ning\u00fan tren sobre \u00e9l puede localizarse.  Desactive una de las p\u00e1ginas, o d\u00e9 su propio sensor a una de las dos casillas.
autosetup.ui.duplicateSensorSubject=El sensor s88 {0} est\u00e1 en la p\u00e1gina \u00ab{1}\u00bb y tambi\u00e9n en la p\u00e1gina \u00ab{2}\u00bb
autosetup.ui.checkArrivalTrapped=Un tren que llegue a {0} por al menos un sentido no podr\u00eda continuar: la \u00fanica v\u00eda por delante es la que acaba de recorrer, y un tren no puede dar la vuelta aqu\u00ed. Active \u00ablos trenes pueden cambiar de sentido aqu\u00ed\u00bb, o abra el camino hacia adelante.
autosetup.ui.checkUnnamedStation=La estaci\u00f3n en {0} todav\u00eda tiene el nombre que se le asign\u00f3 autom\u00e1ticamente. Es el nombre por el que la elegir\u00e1 y con el que se anunciar\u00e1n las llegadas, as\u00ed que d\u00e9le uno que usar\u00eda en voz alta.
autosetup.ui.checkUnlabelledStation={0} no aparece en ninguna parte del diagrama de v\u00edas, as\u00ed que no puede verla mientras circulan los trenes. Haga clic derecho en una casilla de texto en el editor de configuraci\u00f3n para poner el nombre en ella.
