route.ui.frameLockedExplains=Ta trasa nale\u017cy do Central Station. Zmie\u0144 j\u0105 tam i zsynchronizuj ponownie.
route.ui.frameHelp=Trasa robi dwie rzeczy: wykonuje po kolei polecenia u g\u00f3ry i mo\u017ce by\u0107 wstrzymana, dop\u00f3ki makieta nie znajdzie si\u0119 w okre\u015blonym stanie.\n\nPOLECENIA\n\nKa\u017cdy wiersz to jedna czynno\u015b\u0107: prze\u0142o\u017cenie zwrotnicy, ustawienie sygnalizatora, uruchomienie innej trasy. Kolejno\u015b\u0107 TO trasa. Kolumna op\u00f3\u017anienia wstrzymuje kolejne polecenie, dop\u00f3ki wolny nap\u0119d nie sko\u0144czy.\n\nZwrotnica trzydrogowa to jeden wiersz. W rzeczywisto\u015bci to dwa nap\u0119dy pod kolejnymi adresami, a wiersz zapisuje oba polecenia w wymaganej kolejno\u015bci, z przerw\u0105 mi\u0119dzy nimi.\n\nWARUNKI\n\nTrasa czeka, a\u017c b\u0119d\u0105 prawdziwe. Ka\u017cdy wiersz to jeden fakt, a wiersz i/lub mi\u0119dzy dwoma wierszami m\u00f3wi, jak si\u0119 \u0142\u0105cz\u0105.\n\nWci\u0119cie wiersza zagnie\u017cd\u017ca go. Wszystko na jednym poziomie wci\u0119cia to jedna grupa, a s\u0142owo na tym poziomie j\u0105 \u0142\u0105czy. Wszystkie s\u0142owa na jednym poziomie musz\u0105 by\u0107 takie same; odmienne jest pokazane na czerwono. Poni\u017cej zobaczysz, co ca\u0142o\u015b\u0107 znaczy s\u0142owami.\n\nTest odczytuje czujniki w obecnym stanie i m\u00f3wi, czy trasa zosta\u0142aby uruchomiona.\n\nPozostaw warunki puste, a trasa uruchomi si\u0119 za ka\u017cdym razem, gdy zostanie wyzwolona.
