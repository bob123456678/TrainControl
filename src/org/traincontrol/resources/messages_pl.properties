route.ui.helpMessage=Trasy to po prostu ci\u0105g polece\u0144 wykonywanych po kolei. Korzystaj z kreatora, dop\u00f3ki nie nabierzesz wprawy we wpisywaniu polece\u0144 r\u0119cznie.\n\nW polu Polecenia trasy wpisuj po jednym poleceniu w wierszu: nazw\u0119 akcesorium i stan, oddzielone przecinkiem. Na przyk\u0142ad: Switch 20,turn lub Signal 21,green. Typ akcesorium mo\u017cna te\u017c pomin\u0105\u0107: 20,straight lub 21,red. Jeszcze kr\u00f3cej: zamiast turn/red wpisz 1, a zamiast straight/green wpisz 0. Opcjonalna trzecia liczba okre\u015bla op\u00f3\u017anienie przed wykonaniem, w milisekundach.\n\nJe\u015bli chcesz, aby trasa wykonywa\u0142a si\u0119 automatycznie, podaj adres wyzwalaj\u0105cego czujnika S88 i ustaw Automatyczne wykonywanie na "W\u0142.".\n\nWarunki opcjonalne pozwalaj\u0105 okre\u015bli\u0107 logik\u0119 opart\u0105 na czujnikach S88 i/lub stanach akcesori\u00f3w (w tym samym formacie co powy\u017cej), kt\u00f3ra r\u00f3wnie\u017c musi by\u0107 spe\u0142niona, aby trasa wykona\u0142a si\u0119 automatycznie. Dozwolona jest logika logiczna z OR, AND i nawiasami. Na przyk\u0142ad, je\u015bli wyzwalaj\u0105cy adres S88 to 10, a warunkiem S88 jest "Feedback 11,0", to trasa uruchomi si\u0119 tylko wtedy, gdy czujnik S88 11 b\u0119dzie wolny w chwili zadzia\u0142ania czujnika S88 10.\n\nOpr\u00f3cz akcesori\u00f3w polecenia trasy mog\u0105 odwo\u0142ywa\u0107 si\u0119 do innych tras albo do pr\u0119dko\u015bci, kierunku i funkcji lokomotywy:\nlocspeed,Nazwa lokomotywy,50 (ustawia pr\u0119dko\u015b\u0107 na 50)\nlocspeed,Nazwa lokomotywy,-1 (natychmiastowe zatrzymanie)\nlocdir,Nazwa lokomotywy,forward (lub backward)\nlocfunc,Nazwa lokomotywy,20,1 (prze\u0142\u0105cza F20).
