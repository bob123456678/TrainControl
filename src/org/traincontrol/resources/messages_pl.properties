autosetup.ui.infoNoLocomotivesPlaced=Nie umieszczono jeszcze \u017cadnej lokomotywy.
autosetup.ui.warnPageRenumbered=Strona "{0}" wygl\u0105da na przenumerowan\u0105, a ten numer nale\u017cy teraz do "{1}". Jej ustawienia autonomii zosta\u0142y dopasowane wed\u0142ug nazwy strony i zastosowane do w\u0142a\u015bciwego toru.  Dop\u00f3ki to trwa, nic nie jest usuwane - nawet przy zapisie - poniewa\u017c pole, kt\u00f3re wygl\u0105da na brakuj\u0105ce, mo\u017ce by\u0107 tylko takim, kt\u00f3rego numer strony si\u0119 zmieni\u0142.  Zapisz konfiguracj\u0119, aby zarejestrowa\u0107 now\u0105 numeracj\u0119; komunikat zniknie przy nast\u0119pnym wczytaniu.
