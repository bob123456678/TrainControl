autolayout.errorAutoDestinationInvalidValue=The autoDestination value for point {0} must be true or false.
autosetup.ui.errorScissorsNotSupported=Rozjazd krzy\u017cowy w {0} nie mo\u017ce by\u0107 u\u017cywany przez autonomi\u0119. To spos\u00f3b rysowania podw\u00f3jnego rozjazdu angielskiego roz\u0142o\u017conego na dwa pola, wi\u0119c przebiegu toru przez niego nie da si\u0119 okre\u015bli\u0107 na podstawie \u017cadnego z tych p\u00f3l osobno. Zast\u0105p go zwyk\u0142ymi polami rozjazdu albo wy\u0142\u0105cz t\u0119 stron\u0119 z autonomii.
autosetup.ui.errorTileHasNoAddress=Rozjazd lub semafor w {0} nie ma adresu cyfrowego, wi\u0119c TrainControl nie mo\u017ce nim sterowa\u0107. Poci\u0105g wys\u0142any przez niego musia\u0142by zak\u0142ada\u0107, \u017ce jest ju\u017c ustawiony w\u0142a\u015bciwie. Nadaj mu adres albo wy\u0142\u0105cz t\u0119 stron\u0119 z autonomii.
autosetup.ui.errorAdjacentRouteTiles={0}: dwa przyciski przebiegu s\u0105siaduj\u0105 ze sob\u0105, a tor dochodzi do nich, wi\u0119c para prowadzi przebieg przez fragment planu bez szyn.  Odsu\u0144 jeden z nich od toru.
autosetup.ui.errorRouteTileThreeWay={0}: tor dochodzi do tego przycisku przebiegu z trzech stron.  Mo\u017ce poprowadzi\u0107 tylko jeden, wi\u0119c trzeci zostaje pomini\u0119ty - narysuj rozga\u0142\u0119zienie na zwrotnicy, a nie na przycisku.
autosetup.ui.errorLinkNotMutuallyPaired=Po\u0142\u0105czenie w {0} nie jest sparowane z po\u0142\u0105czeniem, kt\u00f3re wskazuje z powrotem na nie. Ka\u017cde po\u0142\u0105czenie musi wskazywa\u0107 dok\u0142adnie jednego partnera, a ten partner musi wskazywa\u0107 je z kolei, inaczej poci\u0105g m\u00f3g\u0142by je przejecha\u0107 i nie m\u00f3g\u0142by wr\u00f3ci\u0107.
autosetup.ui.warnLinkNeverPaired=Po\u0142\u0105czenie w {0} nie zosta\u0142o z niczym sparowane, wi\u0119c nie prowadzi donik\u0105d: tor, kt\u00f3ry do niego dochodzi, ko\u0144czy si\u0119 tam, a to, do czego mia\u0142o prowadzi\u0107 dalej, nie jest t\u0105 drog\u0105 osi\u0105galne. Kliknij je prawym przyciskiem, aby je sparowa\u0107, albo wy\u0142\u0105cz je, \u017ceby nie by\u0142o zn\u00f3w zg\u0142aszane.
autosetup.ui.warnLinkNeverPairedUnreachable=Po\u0142\u0105czenie w {0} nie zosta\u0142o sparowane, ale te\u017c nie dochodzi do niego \u017caden tor - wi\u0119c nic nie mo\u017ce go osi\u0105gn\u0105\u0107. Sparuj je, je\u015bli mia\u0142o dok\u0105d\u015b prowadzi\u0107, albo wy\u0142\u0105cz je z autonomii.
autosetup.ui.warnLinkToExcludedPage=Po\u0142\u0105czenie w {0} wskazuje na stron\u0119, kt\u00f3ra nie jest cz\u0119\u015bci\u0105 autonomii, wi\u0119c nie ma go z czym sparowa\u0107: tor prowadz\u0105cy do niego ko\u0144czy si\u0119 w tym miejscu. W\u0142\u0105cz t\u0119 stron\u0119 do autonomii, je\u015bli trasa ma znaczenie, albo wy\u0142\u0105cz po\u0142\u0105czenie, aby nie by\u0142o ponownie zg\u0142aszane.
autosetup.ui.errorNotANumber="{0}" nie jest liczb\u0105 ca\u0142kowit\u0105, wi\u0119c nic nie zosta\u0142o zmienione.
autosetup.ui.errorLabelWriteFailed=Nazwy stacji, kt\u00f3re dawniej by\u0142y zapisywane w schemacie tor\u00f3w, s\u0105 teraz przechowywane razem z konfiguracj\u0105 autonomii, ale tych stron nie uda\u0142o si\u0119 przepisa\u0107, aby usun\u0105\u0107 stare kopie: {0}. Nic nie zosta\u0142o utracone, a TrainControl spr\u00f3buje ponownie przy nast\u0119pnym uruchomieniu.
autosetup.ui.errorEditorAlreadyOpen=Edytor jest ju\u017c otwarty dla tego schematu. Zamknij go, zanim otworzysz kolejny - dwa edytory wsp\u00f3\u0142dziel\u0105 jeden schemat, a ka\u017cdy z nich cofa\u0142by zmiany drugiego.
autosetup.ui.errorNoSetupToEdit=Konfiguracji autonomii nie mo\u017cna otworzy\u0107 dla tego schematu.\n\nPotrzebny jest lokalny folder schematu, do kt\u00f3rego TrainControl mo\u017ce zapisywa\u0107.
autosetup.ui.confirmExitWithoutSaving=Zamkn\u0105\u0107 edytor autonomii i odrzuci\u0107 wszystko, co zmieniono od ostatniego zapisu?\n\nDotyczy to r\u00f3wnie\u017c wszystkich nazw stacji, kt\u00f3re umie\u015bci\u0142e\u015b na schemacie w tym oknie.
autosetup.ui.confirmJumpWithUnsavedEdits=Przej\u015b\u0107 na drugi koniec tego po\u0142\u0105czenia?\n\nTo okno zamknie si\u0119 i otworzy ponownie na tamtej stronie. Nic nie zostanie utracone - wszystko, co zmieni\u0142e\u015b, jest zachowane - ale jeszcze nie zosta\u0142o zapisane.
autosetup.ui.errorDiscardFailed=Zmian nie uda\u0142o si\u0119 odrzuci\u0107, poniewa\u017c nie uda\u0142o si\u0119 odczyta\u0107 zapisanej konfiguracji: {0}. Edytor pozosta\u0142 otwarty, aby nic nie zosta\u0142o utracone.
autosetup.ui.menuFacingGroup={0} jest skierowana w stron\u0119...
autosetup.ui.hintFacing=W kt\u00f3r\u0105 stron\u0119 stoi poci\u0105g. Do tego pola dochodz\u0105 dwa tory, wi\u0119c poci\u0105g m\u00f3g\u0142 tu przyjecha\u0107 jednym z nich, a to, w kt\u00f3r\u0105 stron\u0119 jest skierowany, decyduje, dok\u0105d mo\u017ce pojecha\u0107 dalej - poci\u0105g nie mo\u017ce ruszy\u0107 do ty\u0142u. Zostaw bez zmian, je\u015bli nie masz pewno\u015bci: autonomia poprawi to przy pierwszym przeje\u017adzie poci\u0105gu.
autosetup.ui.facingN=P\u00f3\u0142noc (w g\u00f3r\u0119 schematu)
autosetup.ui.facingE=Wsch\u00f3d (w prawo)
autosetup.ui.facingS=Po\u0142udnie (w d\u00f3\u0142)
autosetup.ui.facingW=Zach\u00f3d (w lewo)
autosetup.ui.menuUseLink=Autonomia korzysta z tego po\u0142\u0105czenia
autosetup.ui.hintUseLink=Wy\u0142\u0105cz to dla po\u0142\u0105czenia, kt\u00f3re nale\u017cy do samego rysunku, a nie do makiety, po kt\u00f3rej je\u017adzi autonomia. Wtedy nie przewozi ono \u017cadnych poci\u0105g\u00f3w i nie jest zg\u0142aszane jako niesparowane.
autosetup.ui.errorPortalTargetsExcludedPage=Po\u0142\u0105czenie w {0} wskazuje na stron\u0119 wy\u0142\u0105czon\u0105 z autonomii. Sparuj je z po\u0142\u0105czeniem na stronie u\u017cywanej przez autonomi\u0119 albo zostaw niesparowane, \u017ceby \u017caden poci\u0105g nie pr\u00f3bowa\u0142 go przejecha\u0107.
autosetup.ui.warnTurntableNotRoutable=Autonomia zatrzymuje si\u0119 przed obrotnic\u0105 w {0} i nigdy nie poprowadzi po niej poci\u0105g\u00f3w. Reszta makiety nie jest tym dotkni\u0119ta.
autosetup.ui.warnPermanentTurnout=Rozjazd w {0} jest oznaczony jako bezadresowy, wi\u0119c poci\u0105gi mog\u0105 go przeje\u017cd\u017ca\u0107 tylko w kierunku zbiegaj\u0105cym si\u0119, gdzie ustawienie iglic nie ma znaczenia.
autosetup.ui.errorCompanionVersion=Ta konfiguracja autonomii zosta\u0142a zapisana przez nowsz\u0105 wersj\u0119 TrainControl i nie mo\u017ce zosta\u0107 odczytana. Zaktualizuj TrainControl albo przenie\u015b pliki z config/autonomy gdzie indziej, aby zacz\u0105\u0107 od nowa.
autosetup.ui.errorDeleteConfigurationFailed=Nie uda\u0142o si\u0119 usun\u0105\u0107 {0}. Plik mo\u017ce by\u0107 otwarty w innym programie, przytrzymywany przez klienta synchronizacji albo znajdowa\u0107 si\u0119 w folderze, do kt\u00f3rego ten komputer nie mo\u017ce zapisywa\u0107.
autosetup.ui.errorRenameConfigurationFailed=Nie uda\u0142o si\u0119 zmieni\u0107 nazwy {0}. Plik mo\u017ce by\u0107 otwarty w innym programie, przytrzymywany przez klienta synchronizacji albo znajdowa\u0107 si\u0119 w folderze, do kt\u00f3rego ten komputer nie mo\u017ce zapisywa\u0107. Nic nie zosta\u0142o zmienione.
autosetup.ui.errorConfigurationUnreadable=Nie uda\u0142o si\u0119 odczyta\u0107 konfiguracji autonomii {0}, wi\u0119c nic nie zosta\u0142o zmienione: {1}
autosetup.ui.errorAutonomyNeedsLocalLayout=Autonomia wymaga lokalnej kopii schematu tor\u00f3w, poniewa\u017c jej ustawienia s\u0105 zapisywane obok plik\u00f3w schematu. Najpierw pobierz makiet\u0119 z Central Station.
autosetup.ui.checkStationReachesNothing=\u017baden poci\u0105g nie mo\u017ce opu\u015bci\u0107 {0} w kierunku innej stacji. Sprawd\u017a kierunki tor\u00f3w, kt\u00f3re z niej wychodz\u0105.
autosetup.ui.checkStationUnreachable=\u017baden poci\u0105g nie mo\u017ce dotrze\u0107 do {0} z innej stacji.  Sprawd\u017a kierunki tor\u00f3w prowadz\u0105cych do niej oraz czy przyjazdy od strony wjazdu s\u0105 zablokowane.
autosetup.ui.checkTerminusStranded=Poci\u0105g wys\u0142any do {0} nie m\u00f3g\u0142by dotrze\u0107 do \u017cadnej innej stacji.  Sprawd\u017a kierunki tor\u00f3w wychodz\u0105cych oraz czy przyjazdy od strony wyjazdu s\u0105 zablokowane.
autosetup.ui.checkPointIsolated=Nic nie jest po\u0142\u0105czone z {0}, wi\u0119c \u017caden poci\u0105g nigdy go nie minie. Jego tor jest narysowany, ale ka\u017cde po\u0142\u0105czenie do niego zosta\u0142o zamkni\u0119te.
autosetup.ui.checkRunClosedBothWays=Tor w {0} jest zamkni\u0119ty w obu kierunkach, wi\u0119c nic nie mo\u017ce go przejecha\u0107. Zwykle to pomy\u0142kowe klikni\u0119cie przy ustawianiu ruchu jednokierunkowego.
autosetup.ui.checkNoStations=Nie wyznaczono jeszcze \u017cadnej stacji, wi\u0119c autonomia nie ma dok\u0105d wys\u0142a\u0107 poci\u0105gu. Oznacz co najmniej dwa czujniki jako stacje.
autosetup.ui.checkOneStation={0} to jedyna stacja, wi\u0119c autonomia nie ma dok\u0105d indziej wys\u0142a\u0107 poci\u0105gu. Wyznacz co najmniej jedn\u0105 kolejn\u0105.
autosetup.ui.checkUnnamedPoint=Czujnik w {0} nadal ma nazw\u0119 nadan\u0105 automatycznie. Poci\u0105gi go mijaj\u0105, zamiast si\u0119 na nim zatrzymywa\u0107, wi\u0119c to raczej co\u015b do uporz\u0105dkowania ni\u017c pilna sprawa - ale to pod t\u0105 nazw\u0105 b\u0119dzie oznaczany przejazd t\u0119dy.
autosetup.ui.checkMayTurnOnDeadEnd={0} jest ustawione na "poci\u0105gi mog\u0105 tu zmieni\u0107 kierunek", ale \u017caden przyje\u017cd\u017caj\u0105cy poci\u0105g nie mo\u017ce jecha\u0107 dalej - ka\u017cdy wjazd prowadzi tylko z powrotem, wi\u0119c i tak wszystkie zawracaj\u0105.  "Musi" m\u00f3wi to ja\u015bniej.
autosetup.ui.checkReversingLeadsNowhere=Pociagi zmieniaja kierunek na {0}, ale stamtad nie mozna dojechac do zadnej stacji - pociag tam wyslany zawrocilby i nadal nie mialby dokad jechac. Jesli droga dalej miala byc otwarta, to jest pole do sprawdzenia.
autosetup.ui.checkCaptionCovered=Nazwy {0} nie wida\u0107: pole, na kt\u00f3rym narysowany jest jej podpis, zawiera te\u017c tw\u00f3j w\u0142asny tekst, i to ten tekst jest wy\u015bwietlany. Przenie\u015b podpis na wolne pole albo usu\u0144 tekst.
autosetup.ui.checkHomeNeedsReversible=Baza w {0} mo\u017ce by\u0107 u\u017cywana tylko przez lokomotyw\u0119 zdoln\u0105 zmieni\u0107 kierunek jazdy. Ka\u017cdy poci\u0105g musi zawr\u00f3ci\u0107 na tym polu, wi\u0119c poci\u0105g, kt\u00f3ry tego nie potrafi, nigdy nie zostanie tu odes\u0142any do bazy.
autosetup.ui.checkProtectingSignalGone=Semafor sparowany z {0} nie znajduje si\u0119 ju\u017c na tej makiecie, wi\u0119c ten peron nie jest ju\u017c w pe\u0142ni zabezpieczony. Sparuj go z innym semaforem albo usu\u0144 parowanie.
autosetup.ui.checkFacingImpossible={0} ma zapisan\u0105 lokomotyw\u0119 skierowan\u0105 w stron\u0119, na kt\u00f3r\u0105 to pole ju\u017c nie pozwala - tor wok\u00f3\u0142 niego zmieni\u0142 si\u0119 od tego czasu. Autonomia ustawi j\u0105 skierowan\u0105 w pierwsz\u0105 stron\u0119, jak\u0105 oferuje pole, co mo\u017ce by\u0107 stron\u0105 przeciwn\u0105. Ustaw kierunek z menu kontekstowego.
autosetup.ui.checkNoProtectingSignal={0} nie ma przypisanego semafora.
autosetup.ui.checkDuplicateLocomotive={0} ma lokomotyw\u0119, kt\u00f3ra jest te\u017c zapisana jako stoj\u0105ca gdzie indziej. Lokomotywa mo\u017ce by\u0107 tylko w jednym miejscu, a autonomia odrzuca ca\u0142\u0105 konfiguracj\u0119, dop\u00f3ki stoi w dw\u00f3ch - usu\u0144 j\u0105 wi\u0119c z pola, na kt\u00f3rym nie stoi.
autosetup.ui.checkNoTrainLength={1} w {0} nie ma ustawionej d\u0142ugo\u015bci, wi\u0119c nigdy nie zostanie odrzucony z peronu jako zbyt d\u0142ugi.
autosetup.ui.checkNoMaxTrainLength={0} nie ma maksymalnej d\u0142ugo\u015bci poci\u0105gu, wi\u0119c \u017caden poci\u0105g nie jest dla niej za d\u0142ugi.
autosetup.ui.checkDuplicateSensorPage={1}, wi\u0119c jeden czujnik reprezentuje dwa miejsca i \u017caden poci\u0105g na nim nie mo\u017ce zosta\u0107 zlokalizowany.  Wy\u0142\u0105cz jedn\u0105 ze stron albo nadaj jednemu z dw\u00f3ch p\u00f3l w\u0142asny czujnik.
autosetup.ui.duplicateSensorSubject=Czujnik s88 {0} znajduje si\u0119 na stronie \u201e{1}\u201d oraz na stronie \u201e{2}\u201d
autosetup.ui.checkArrivalTrapped=Poci\u0105g docieraj\u0105cy do {0} z co najmniej jednego kierunku nie m\u00f3g\u0142by jecha\u0107 dalej: jedyny tor przed nim to ten, kt\u00f3rym w\u0142a\u015bnie przyjecha\u0142, a poci\u0105g nie mo\u017ce tu zawr\u00f3ci\u0107. Ustaw "poci\u0105gi mog\u0105 tu zmieni\u0107 kierunek" albo otw\u00f3rz drog\u0119 dalej.
autosetup.ui.checkUnnamedStation=Stacja w {0} nadal ma nazw\u0119 nadan\u0105 automatycznie. To pod t\u0105 nazw\u0105 b\u0119dziesz j\u0105 wybiera\u0107 i pod ni\u0105 b\u0119d\u0105 zapowiadane przyjazdy, wi\u0119c nadaj jej tak\u0105, jakiej u\u017cy\u0142by\u015b na g\u0142os.
autosetup.ui.checkUnlabelledStation={0} nie jest pokazana nigdzie na schemacie tor\u00f3w, wi\u0119c nie widzisz jej podczas jazdy poci\u0105g\u00f3w. Kliknij prawym przyciskiem pole tekstowe w edytorze konfiguracji, aby umie\u015bci\u0107 na nim nazw\u0119.
