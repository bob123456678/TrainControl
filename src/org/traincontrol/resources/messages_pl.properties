autosetup.ui.infoGraphExported=Wyprowadzony graf zosta\u0142 zapisany do {0}, w folderze, kt\u00f3ry zaraz si\u0119 otworzy.\n\nTo dane diagnostyczne: pokazuj\u0105, do czego kompiluje si\u0119 schemat, a nie plik, z kt\u00f3rego korzysta autonomia.
autosetup.ui.infoNoLocomotivesPlaced=Nie umieszczono jeszcze \u017cadnej lokomotywy.
autosetup.ui.errorCannotBuild=Tej konfiguracji nie mo\u017cna jeszcze u\u017cywa\u0107. Zobacz list\u0119 "Co sprawdzi\u0107".
autosetup.ui.errorAutonomyRunning=Jad\u0105 poci\u0105gi. Zatrzymaj je najpierw - zmiana konfiguracji pod jad\u0105cym poci\u0105giem zostawi\u0142aby go w ruchu bez niczego, co mia\u0142oby nad nim kontrol\u0119.
autosetup.ui.warnPageRenumbered=Strona "{0}" wygl\u0105da na przenumerowan\u0105, a ten numer nale\u017cy teraz do "{1}". Jej ustawienia autonomii nie zosta\u0142y zastosowane, poniewa\u017c przypi\u0119\u0142yby si\u0119 do niew\u0142a\u015bciwego toru.
autosetup.ui.warnQuotesStrippedFromName=Cudzys\u0142owy s\u0105 usuwane z nazw, wi\u0119c ta zostanie zapisana bez nich.
autosetup.ui.labelTilesSelected=Wybrano {0}
autosetup.ui.btnInitFromLayout=Skonfiguruj autonomi\u0119 dla tej makiety
