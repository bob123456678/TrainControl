autosetup.ui.tooltipShowUnmeasured=Podswietla tor bez dlugosci - odcinki sumujace sie do zera oraz zwrotnice i skrzyzowania bez dlugosci.
autosetup.ui.menuMassAssignLengths=Przypisz d\u0142ugo\u015bci zbiorczo...
autosetup.ui.tooltipMassAssignLengths=Wciaz bez dlugosci tutaj - tor: {0}, zwrotnice: {1}, skrzyzowania: {2}.
autosetup.ui.promptMassAssignLength=Odcinek {0} z {1}, mi\u0119dzy {2} a {3}, obrysowany na schemacie (pola: {4}).  Podaj ca\u0142kowit\u0105 d\u0142ugo\u015b\u0107 tego odcinka (0 = brak):
autosetup.ui.promptMassAssignSwitches=Zwrotnice na tej stronie bez d\u0142ugo\u015bci: {0}.  S\u0105 obrysowane na schemacie.  Podaj d\u0142ugo\u015b\u0107 jednej zwrotnicy; ka\u017cda z nich j\u0105 otrzyma (0 = brak):
autosetup.ui.promptMassAssignCrossings=Pola na tej stronie, na kt\u00f3rych krzy\u017cuj\u0105 si\u0119 dwa tory, bez d\u0142ugo\u015bci: {0}.  S\u0105 obrysowane na schemacie.  Podaj d\u0142ugo\u015b\u0107 jednego takiego pola; ka\u017cde j\u0105 otrzyma i liczy si\u0119 na obu torach (0 = brak):
autosetup.ui.switchAtSquare=zwrotnica w {0}
