route.ui.tooltipTermPill=Dodaj {0} do formu\u0142y
route.ui.frameHelp=Trasa robi dwie rzeczy: ustawia akcesoria wymienione u g\u00f3ry i mo\u017ce zosta\u0107 wstrzymana, dop\u00f3ki makieta nie znajdzie si\u0119 w okre\u015blonym stanie.\n\nT\u0119 drug\u0105 cz\u0119\u015b\u0107 buduje si\u0119 w dw\u00f3ch krokach.\n\n1. Wypisz FAKTY, kt\u00f3re maj\u0105 znaczenie, po jednym w wierszu. Ka\u017cdy wiersz dostaje liter\u0119.\n\n2. Napisz FORMU\u0141\u0118, kt\u00f3ra ma by\u0107 prawdziwa, u\u017cywaj\u0105c tych liter: A, albo A and B, albo (A or B) and (C or D). Przyciski poni\u017cej wpisz\u0105 je za ciebie.\n\nPod formu\u0142\u0105 zobaczysz, co znaczy s\u0142owami. "and" wi\u0105\u017ce mocniej ni\u017c "or".\n\nZostaw formu\u0142\u0119 pust\u0105, a trasa nie b\u0119dzie mia\u0142a warunk\u00f3w.
