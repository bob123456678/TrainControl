autosetup.log.captionsMigrated=Nazwy stacji zapisane na planie tor\u00f3w przez wcze\u015bniejsz\u0105 wersj\u0119 zosta\u0142y przeniesione do konfiguracji autonomii i usuni\u0119te z tych stron: {0} (\u0142\u0105cznie {1} nazw).  Obok pliku .cs2 ka\u017cdej z nich le\u017cy plik .bak z t\u0105 stron\u0105 w postaci sprzed pierwszego zapisu przez t\u0119 wersj\u0119.
