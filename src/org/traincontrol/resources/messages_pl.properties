autosetup.log.noteRepairFailed=Zapisu niedoko\u0144czonej edycji planu tor\u00f3w nie uda\u0142o si\u0119 zaktualizowa\u0107 dla zmienionej nazwy lokomotywy, wi\u0119c nadal wskazuje star\u0105: config/autonomy/setup-before-edit.json.  Je\u015bli TrainControl zostanie uruchomiony ponownie przed doko\u0144czeniem tej edycji, przywr\u00f3cona konfiguracja b\u0119dzie wskazywa\u0107 lokomotyw\u0119, kt\u00f3ra ju\u017c nie istnieje - usu\u0144 ten plik, aby temu zapobiec.
autosetup.log.unfinishedEditNoteUnusable=Zapis niedoko\u0144czonej edycji planu tor\u00f3w nie m\u00f3g\u0142 zosta\u0107 u\u017cyty i pozostawiono go: config/autonomy/setup-before-edit.json
