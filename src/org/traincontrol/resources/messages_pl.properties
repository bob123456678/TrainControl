autosetup.ui.infoImported=Zaimportowano. {0} nazw stacji, d\u0142ugo\u015bci i innych ustawie\u0144 tor\u00f3w przeniesiono z pliku, aby wype\u0142ni\u0107 luki w tej konfiguracji.
autosetup.ui.infoPagesExcludedForSensors={0} stron(y) pozostawiono poza autonomi\u0105, poniewa\u017c powtarzaj\u0105 adresy sygnalizacji powrotnej ju\u017c u\u017cywane przez wcze\u015bniejsz\u0105 stron\u0119: {1}. Dw\u00f3ch p\u00f3l o tym samym adresie nie da si\u0119 rozr\u00f3\u017cni\u0107, wi\u0119c zachowywana jest wcze\u015bniejsza strona. Mo\u017cesz z powrotem w\u0142\u0105czy\u0107 dowoln\u0105 stron\u0119 z edytora autonomii.
autosetup.ui.infoLegacyImported=Nazwano {0} p\u00f3l, umieszczono {1} lokomotyw, oznaczono {2} jako zawracaj\u0105ce poci\u0105gi i przeniesiono {3} innych ustawie\u0144. {4} p\u00f3l mia\u0142o ju\u017c nazw\u0119 i pozostawiono je bez zmian. {5} punkt\u00f3w nie uda\u0142o si\u0119 dopasowa\u0107 do czujnika na tym schemacie.
autosetup.ui.leftBehind={0} rzeczy w pliku celowo nie zaimportowano.  Dziennik je wymienia.
autosetup.ui.leftBehindHeading=Ten import celowo pomin\u0105\u0142 poni\u017csze.  Pozostaj\u0105 w odczytanym pliku, kt\u00f3rego nie zmieniono:
autosetup.ui.leftEdgeCommands={0} po\u0142\u0105cze\u0144 mia\u0142o polecenia akcesori\u00f3w.  Polecenia s\u0105 teraz wyprowadzane ze schematu tor\u00f3w, wi\u0119c nie s\u0105 przenoszone.
autosetup.ui.leftEdgeLengths={0} po\u0142\u0105cze\u0144 mia\u0142o d\u0142ugo\u015b\u0107.  D\u0142ugo\u015bci nale\u017c\u0105 teraz do p\u00f3l, a jednej na po\u0142\u0105czenie nie da si\u0119 rozdzieli\u0107.
autosetup.ui.leftEdgeLocks={0} po\u0142\u0105cze\u0144 blokowa\u0142o inne po\u0142\u0105czenia r\u0119cznie.  Blokady s\u0105 teraz wyprowadzane z planu tor\u00f3w - dwa po\u0142\u0105czenia dziel\u0105ce pole blokuj\u0105 si\u0119 wzajemnie - wi\u0119c r\u0119czna blokada mi\u0119dzy po\u0142\u0105czeniami bez wsp\u00f3lnego pola nie zostaje przeniesiona.  Sprawd\u017a ka\u017cde miejsce, w kt\u00f3rym dwa poci\u0105gi nie mog\u0105 jecha\u0107 naraz, cho\u0107 tory si\u0119 nie stykaj\u0105.
autosetup.ui.leftSignalAuthors={0} sygnalizator\u00f3w by\u0142o prze\u0142\u0105czanych r\u0119cznie w poprzedniej konfiguracji (numery {1}).  Sygnalizatory s\u0105 teraz sterowane tylko tam, gdzie po\u0142\u0105czy je Pan(i) ze stacj\u0105, z menu tej stacji.  Prosz\u0119 sprawdzi\u0107 ka\u017cdy: te niepo\u0142\u0105czone po prostu pozostan\u0105 zielone.
autosetup.ui.facingsGuessed=W przypadku {0} poci\u0105g\u00f3w kierunek jazdy zosta\u0142 wybrany automatycznie, poniewa\u017c stary plik nie potrafi poda\u0107, w kt\u00f3r\u0105 stron\u0119 zwr\u00f3cony jest poci\u0105g.  U\u017cyto pierwszego pasuj\u0105cego kierunku.  Sprawd\u017a je na planie tor\u00f3w albo po prostu je uruchom - pierwszy przejazd zapisuje rzeczywisty kierunek.
autosetup.ui.leftModernFields={0} p\u00f3l zawiera\u0142o ustawienia, kt\u00f3rych stary format nigdy nie mia\u0142 - ten plik wygl\u0105da wi\u0119c na eksport z tej wersji, a nie na starszy plik.  Import t\u0105 drog\u0105 zachowuje tylko to, co stary format potrafi\u0142 wyrazi\u0107, a reszt\u0119 odrzuca.  Je\u015bli tak w\u0142a\u015bnie jest, wczytaj konfiguracj\u0119 zamiast j\u0105 importowa\u0107.
autosetup.ui.leftRouteActivations=Aktywacje tras.  Ich przeniesienie w\u0142\u0105cza\u0142oby i wy\u0142\u0105cza\u0142o trasy na prawdziwej makiecie przy ka\u017cdym wczytaniu.
autosetup.ui.leftTimetable=Rozk\u0142ad o {0} pozycjach.  Jego punkty dopasowuje si\u0119 po czujniku, a wsp\u00f3lny czujnik nie powie, o kt\u00f3re pole chodzi\u0142o.
autosetup.ui.infoLegacyUnknownLocs=Nie umieszczono, poniewa\u017c w bazie danych nie ma \u017cadnej lokomotywy o tej nazwie: {0}. Dodaj je lub zmie\u0144 im nazw\u0119 i zaimportuj ponownie.
autosetup.ui.infoLegacyDuplicateLocs=Umieszczono tylko przy pierwszym punkcie, kt\u00f3ry je nazywa\u0142, poniewa\u017c lokomotywa nie mo\u017ce sta\u0107 w dw\u00f3ch miejscach: {0}.
