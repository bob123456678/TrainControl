autosetup.ui.promptPointName=Jak powinien nazywa\u0107 si\u0119 ten czujnik? Nazwa pojawia si\u0119 w dzienniku, w rozk\u0142adach jazdy i na schemacie, wi\u0119c co\u015b w rodzaju "Wjazd na tor 14" jest wygodniejsze ni\u017c wsp\u00f3\u0142rz\u0119dna.
autosetup.ui.labelPointNotStation=Tylko czujnik mo\u017ce by\u0107 stacj\u0105, poniewa\u017c inaczej autonomia nie ma jak stwierdzi\u0107, \u017ce poci\u0105g przyjecha\u0142. Wybierz pole z sygnalizacj\u0105 powrotn\u0105.
autosetup.ui.promptLinkName=Jak powinno nazywa\u0107 si\u0119 to po\u0142\u0105czenie? Nast\u0119pnie kliknij po\u0142\u0105czenie, do kt\u00f3rego prowadzi, na tej lub innej stronie.
autosetup.ui.tooltipGestures=Kliknij teraz po\u0142\u0105czenie, do kt\u00f3rego prowadzi to. Kliknij je ponownie, aby usun\u0105\u0107 parowanie.
autosetup.ui.infoUnnamedLinkNotConnected=To pole nie jest ani po\u0142\u0105czeniem, ani tunelem. Tylko one prowadz\u0105 dalej w inne miejsce makiety.
autosetup.ui.promptTileLength=Jak\u0105 d\u0142ugo\u015b\u0107 ma liczy\u0107 ten kawa\u0142ek toru? D\u0142ugo\u015bci to twoje w\u0142asne jednostki, sumowane wzd\u0142u\u017c trasy i por\u00f3wnywane z d\u0142ugo\u015bciami poci\u0105g\u00f3w. 0 oznacza, \u017ce si\u0119 nie liczy.
autosetup.ui.errorNegativeLength=D\u0142ugo\u015b\u0107 musi by\u0107 liczb\u0105 ca\u0142kowit\u0105, 0 lub wi\u0119ksz\u0105.
