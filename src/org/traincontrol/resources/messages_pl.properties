autolayout.errorAutoDestinationInvalidValue=The autoDestination value for point {0} must be true or false.
autosetup.ui.errorScissorsNotSupported=A scissors crossing at {0} cannot be used for autonomy.  It is a way of drawing one double slip switch across two tiles, so the track through it cannot be worked out from either tile on its own.  Replace it with ordinary switch tiles, or leave that page out of autonomy.
autosetup.ui.errorTileHasNoAddress=The switch or signal at {0} has no digital address, so TrainControl cannot set it.  A train sent over it would be trusting it to already be lying the right way.  Give it an address, or leave that page out of autonomy.
autosetup.ui.errorLinkNotMutuallyPaired=The link at {0} is not paired with a link that points back at it.  Each link must name exactly one partner, and that partner must name it in return, or a train could cross and be unable to return.
autosetup.ui.warnLinkNeverPaired=The link at {0} has not been paired with anything, so it leads nowhere: the track running into it ends there, and whatever it was meant to continue onto cannot be reached this way.  Right-click it to pair it, or switch it off so it is not reported again.
autosetup.ui.warnLinkNeverPairedUnreachable=The link at {0} has not been paired, but no track runs into it either - so nothing can reach it.  Pair it if it was meant to lead somewhere, or leave it out of autonomy.
autosetup.ui.errorNotANumber="{0}" is not a whole number, so nothing was changed.
autosetup.ui.errorLabelWriteFailed=Station names that used to be stored in the track diagram are now kept with the autonomy setup, but these pages could not be rewritten to remove the old copies: {0}.  Nothing has been lost, and TrainControl will try again next time it starts.
autosetup.ui.errorEditorAlreadyOpen=An editor is already open on this layout.  Close it before opening another - two of them share one diagram, and each would undo the other\u2019s changes.
autosetup.ui.confirmExitWithoutSaving=Close the autonomy editor and throw away everything changed since you last saved?\n\nThat includes any station names you have put on the diagram in this window.
autosetup.ui.errorDiscardFailed=The changes could not be thrown away, because the saved setup could not be read back: {0}.  The editor has been left open so that nothing is lost.
autosetup.ui.menuFacingGroup={0} Is Facing...
autosetup.ui.hintFacing=Which way round the train is standing.  Two lines reach this square, so a train here could have come along either of them, and which way it points decides where it can go next - a train cannot set off backwards.  Leave it alone if you are not sure: autonomy corrects it the first time the train runs.
autosetup.ui.facingN=North (up the diagram)
autosetup.ui.facingE=East (right)
autosetup.ui.facingS=South (down)
autosetup.ui.facingW=West (left)
autosetup.ui.menuUseLink=Autonomy Uses This Link
autosetup.ui.hintUseLink=Switch this off for a link that belongs to the drawing rather than to the railway autonomy runs.  It then carries no trains and is not reported as unpaired.
autosetup.ui.errorPortalTargetsExcludedPage=The link at {0} points at a page that is left out of autonomy.  Either pair it with a link on a page autonomy uses, or leave it unpaired so no train tries to cross it.
autosetup.ui.warnTurntableNotRoutable=Autonomy stops at the turntable at {0} and will not run trains across it.  The rest of the layout is unaffected.
autosetup.ui.warnPermanentTurnout=The switch at {0} is marked as having no address, so trains may only pass it in the trailing direction, where the position of the blades does not matter.
autosetup.ui.errorCompanionVersion=This autonomy setup was written by a newer version of TrainControl and cannot be read.  Update TrainControl, or move the files in config/autonomy aside to start again.
autosetup.ui.errorDeleteConfigurationFailed=Could not delete {0}.  The file may be open in another program, held by a sync client, or in a folder this computer cannot write to.
autosetup.ui.errorConfigurationUnreadable=The autonomy configuration {0} could not be read, so nothing was changed: {1}
autosetup.ui.errorAutonomyNeedsLocalLayout=Autonomy needs a local copy of the track diagram, because its settings are stored alongside the diagram files.  Download the layout from the Central Station first.
autosetup.ui.checkStationReachesNothing=No train can leave {0} for any other station.  Check the directions on the track leading away from it.
autosetup.ui.checkStationUnreachable=No train can reach {0} from any other station.  Check the directions on the track leading to it.
autosetup.ui.checkTerminusStranded=A train sent to {0} could not leave again.  A terminus needs a way out, even if that is back the way it came, so the track there has to run both ways.
autosetup.ui.checkPointIsolated=Nothing connects to {0}, so no train will ever pass it.  Its track is drawn, so every connection to it has been closed.
autosetup.ui.checkRunClosedBothWays=The track at {0} is closed in both directions, so nothing can pass it.  This is usually a mis-click while setting one-way running.
autosetup.ui.checkNoStations=No station has been designated yet, so autonomy has nowhere to send a train.  Mark at least two sensors as stations.
autosetup.ui.checkOneStation={0} is the only station, so autonomy has nowhere to send a train.  Mark at least one more.
autosetup.ui.checkUnnamedPoint=The sensor at {0} still has the name it was given automatically.  Trains pass it rather than stop at it, so this is worth tidying rather than urgent - but it is what a path through here will be called.
autosetup.ui.checkMayTurnOnDeadEnd={0} is set to "trains may change direction here", but only one line runs into it - so there is nothing to carry on to and every train turns round anyway.  "Must" says the same thing plainly.
autosetup.ui.checkCaptionCovered=The name of {0} cannot be seen: the square its caption is drawn on also carries text of your own, and your text is what gets shown.  Move the caption to a free square, or clear the text.
autosetup.ui.checkHomeNeedsReversible=The home at {0} can only be used by a locomotive that can change direction.  Every train has to turn round on this square, so a train that cannot will never be sent home here.
autosetup.ui.checkProtectingSignalGone=The signal paired with {0} is no longer on this layout, so that platform is not being protected.  Pair it with another signal, or remove the pairing.
autosetup.ui.checkNoProtectingSignal={0} nie ma przypisanego semafora.
autosetup.ui.checkDuplicateLocomotive={0} holds a locomotive that is also recorded as standing somewhere else.  A locomotive can only be in one place, and autonomy refuses the whole setup while it is in two - so take it off whichever square it is not on.
autosetup.ui.checkArrivalTrapped=A train reaching {0} from at least one direction could not go on: the only track ahead of it is the track it just came along, and a train cannot turn round here.  Either set "trains may change direction here", or open the way ahead.
autosetup.ui.checkUnnamedStation=The station at {0} still has the name it was given automatically.  It is the name you will pick it by and the name arrivals are announced under, so give it one you would use out loud.
autosetup.ui.checkUnlabelledStation={0} is not shown anywhere on the track diagram, so you cannot see it while trains are running.  Right-click a text square in the setup editor to put the name on it.
