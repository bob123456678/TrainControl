autosetup.ui.promptConfigurationName=Jak powinna nazywa\u0107 si\u0119 ta konfiguracja? Konfiguracje wsp\u00f3\u0142dziel\u0105 tor, a r\u00f3\u017cni\u0105 si\u0119 tym, gdzie startuj\u0105 lokomotywy.
