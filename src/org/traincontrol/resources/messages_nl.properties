# Untranslated: English text, kept here so the key set matches messages.properties.
# Replace the values as these are translated.
autolayout.errorAutoDestinationInvalidValue=De waarde autoDestination voor punt {0} moet true of false zijn.
autosetup.ui.errorScissorsNotSupported=Een kruiswissel bij {0} kan niet door de autonomie worden gebruikt. Het is een manier om een dubbele Engelse wissel over twee vakjes te tekenen, waardoor het spoorverloop erdoorheen niet uit een van beide vakjes afzonderlijk valt af te leiden. Vervang hem door gewone wisselvakjes, of laat die pagina buiten de autonomie.
autosetup.ui.errorTileHasNoAddress=De wissel of het sein bij {0} heeft geen digitaal adres, dus TrainControl kan het niet aansturen. Een trein die erover wordt gestuurd zou erop moeten vertrouwen dat het al goed staat. Geef het een adres, of laat die pagina buiten de autonomie.
autosetup.ui.errorAdjacentRouteTiles={0}: twee routeknoppen staan naast elkaar met spoor dat erop uitkomt, zodat het paar een route geleidt over een stuk schema zonder rails.  Verplaats er \u00e9\u00e9n weg van het spoor.
autosetup.ui.errorRouteTileThreeWay={0}: er komt spoor van drie kanten op deze routeknop uit.  Hij kan er \u00e9\u00e9n doorgeleiden, dus de derde vervalt - teken de aftakking op een wissel in plaats van op een knop.
autosetup.ui.errorLinkNotMutuallyPaired=De verbinding bij {0} is niet gekoppeld aan een verbinding die naar haar terugwijst. Elke verbinding mag precies \u00e9\u00e9n partner noemen, en die partner moet haar op zijn beurt ook noemen, anders zou een trein kunnen oversteken en niet meer terug kunnen.
autosetup.ui.warnLinkNeverPaired=De verbinding bij {0} is aan niets gekoppeld, dus leidt hij nergens heen: het spoor dat erin uitkomt eindigt daar, en waar hij op had moeten aansluiten is via deze weg niet te bereiken. Klik er met rechts op om hem te koppelen, of schakel hem uit zodat hij niet opnieuw wordt gemeld.
autosetup.ui.warnLinkNeverPairedUnreachable=De verbinding bij {0} is niet gekoppeld, maar er loopt ook geen spoor naartoe - dus niets kan hem bereiken. Koppel hem als hij ergens heen moest leiden, of laat hem buiten de autonomie.
autosetup.ui.warnLinkToExcludedPage=De verbinding bij {0} wijst naar een pagina die geen deel uitmaakt van de autonomie, dus er is niets om hem aan te koppelen: het spoor dat ernaartoe loopt eindigt daar. Neem die pagina op in de autonomie als de route ertoe doet, of schakel de verbinding uit zodat hij niet opnieuw wordt gemeld.
autosetup.ui.errorNotANumber="{0}" is geen geheel getal, dus er is niets gewijzigd.
autosetup.ui.errorLabelWriteFailed=Stationsnamen die vroeger in het spoorplan werden bewaard, worden nu samen met de autonomie-instellingen bijgehouden, maar deze pagina\u2019s konden niet herschreven worden om de oude kopie\u00ebn te verwijderen: {0}. Er is niets verloren gegaan, en TrainControl probeert het bij de volgende start opnieuw.
autosetup.ui.errorEditorAlreadyOpen=Er is al een editor geopend voor dit spoorplan. Sluit deze voordat u een andere opent - twee editors delen hetzelfde plan, en elk zou de wijzigingen van de ander ongedaan maken.
autosetup.ui.errorNoSetupToEdit=De autonomie-instellingen kunnen voor dit spoorplan niet worden geopend.\n\nDaarvoor is een lokale planmap nodig waarin TrainControl kan schrijven.
autosetup.ui.confirmExitWithoutSaving=Autonomie-editor sluiten en alles weggooien wat is gewijzigd sinds de laatste keer opslaan?\n\nDat geldt ook voor stationsnamen die u in dit venster op het plan hebt gezet.
autosetup.ui.errorDiscardFailed=De wijzigingen konden niet worden weggegooid, omdat de opgeslagen instellingen niet konden worden teruggelezen: {0}. De editor is open gelaten zodat er niets verloren gaat.
