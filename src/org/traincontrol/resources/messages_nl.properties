autosetup.ui.confirmExitWithoutSaving=Autonomie-editor sluiten en alles weggooien wat is gewijzigd sinds de laatste keer opslaan?\n\nDat geldt ook voor stationsnamen die u in dit venster op het plan hebt gezet.
autosetup.ui.confirmJumpWithUnsavedEdits=Naar het andere uiteinde van deze verbinding gaan?\n\nDit venster sluit en opent opnieuw op die pagina. Er gaat niets verloren - alles wat u hebt gewijzigd blijft behouden - maar het is nog niet opgeslagen.
