autosetup.ui.errorScissorsNotSupported=Een kruiswissel bij {0} kan niet door de autonomie worden gebruikt. Het is een manier om een dubbele Engelse wissel over twee vakjes te tekenen, waardoor het spoorverloop erdoorheen niet uit een van beide vakjes afzonderlijk valt af te leiden. Vervang hem door gewone wisselvakjes, of laat die pagina buiten de autonomie.
