route.ui.frameHelp=Een route doet twee dingen: hij werkt de opdrachten bovenaan op volgorde af, en hij kan worden tegengehouden totdat de baan in een bepaalde toestand is.\n\nOPDRACHTEN\n\nElke regel is \u00e9\u00e9n handeling: een wissel omzetten, een sein zetten, een andere route starten. De volgorde IS de route. De kolom vertraging houdt de volgende opdracht tegen terwijl een trage motor klaar is.\n\nEen driewegwissel is \u00e9\u00e9n regel. Het zijn eigenlijk twee motoren op opeenvolgende adressen, en de regel schrijft beide opdrachten in de volgorde waarin ze verstuurd moeten worden, met een pauze ertussen.\n\nVOORWAARDEN\n\nDe route wacht tot deze waar zijn voordat hij ZICHZELF activeert - op zijn S88-trigger. Start je hem met de hand, via de afspeelknop, het rechtsklikmenu of een routevak op het spoorplan, dan loopt hij wat de voorwaarden ook zeggen: jij ziet de baan, de voorwaarde niet. Elke regel is \u00e9\u00e9n feit, en de en/of-regel tussen twee regels zegt hoe ze samengaan.\n\nSpring een regel in om hem te nesten. Alles op hetzelfde inspringniveau is \u00e9\u00e9n groep, en het woord op dat niveau verbindt hem. Alle woorden op \u00e9\u00e9n niveau moeten hetzelfde woord zijn; een afwijkend woord wordt rood getoond. Daaronder staat wat het geheel in woorden betekent.\n\nTest leest de sensoren zoals ze nu zijn en zegt of de route zou worden geactiveerd.\n\nLaat de voorwaarden leeg en de route wordt geactiveerd zodra hij wordt getriggerd.
