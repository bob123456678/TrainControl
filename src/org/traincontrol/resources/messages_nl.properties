autosetup.ui.checkCaptionCovered=De naam van {0} is niet te zien: op het vakje waarop het bijschrift staat, staat ook eigen tekst van u, en die tekst wordt getoond. Verplaats het bijschrift naar een vrij vakje, of wis de tekst.
autosetup.ui.checkHomeNeedsReversible=Elke trein moet keren op het vakje bij {0}. Een locomotief die niet van richting kan veranderen rijdt met de neus vooruit deze thuisbasis in en moet er met de hand achteruit weer uit.
autosetup.ui.checkReversalNeedsLength=Treinen keren bij {0} en voor dat spoor is geen lengte vastgelegd, dus is niet te zeggen of een lange trein over de wissel erachter zou staan.  Vul de spoorlengte in.
autosetup.ui.checkReversalNeedsLengthRun=Treinen keren bij {0} en voor {2} vakjes daar en op de weg ernaartoe is geen lengte vastgelegd, dus is niet te zeggen of een lange trein over de wissel erachter zou staan.  Vul de spoorlengtes in.
autosetup.ui.checkCopyNoWayOut=Een trein die {0} van die kant bereikt kan er niet meer weg: er loopt geen spoor naar buiten.  De automaat kan er toch een heen sturen.  Open een uitgang of blokkeer de aankomst van die kant.
autosetup.ui.checkCopyNoWayIn=Niets kan {0} bereiken: er loopt geen spoor naar binnen.  Een trein die daar blijft staan wordt door Naar huis niet verplaatst en blokkeert alles erachter.
