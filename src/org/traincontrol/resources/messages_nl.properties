autosetup.ui.checkUnnamedPoint=De sensor bij {0} heeft nog de automatisch gegeven naam. Treinen rijden erlangs in plaats van te stoppen, dus dit is eerder iets om op te ruimen dan urgent - maar het is de naam waaronder een rit hierlangs wordt aangeduid.
autosetup.ui.checkMayTurnOnDeadEnd={0} staat op "treinen mogen hier van richting veranderen", maar geen aankomende trein kan doorrijden - elke inrit leidt alleen terug, dus ze keren toch allemaal.  "Moet" zegt dat duidelijker.
