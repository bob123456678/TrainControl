autosetup.ui.checkProtectingSignalGone=Een sein dat aan {0} is gekoppeld, staat niet meer op dit spoorplan, dus dat perron is niet meer volledig beveiligd. Koppel het aan een ander sein, of verwijder de koppeling.
autosetup.ui.checkFacingImpossible={0} heeft een locomotief geregistreerd staan die gericht is naar een kant die dit vakje niet meer toelaat - het spoor eromheen is intussen veranderd. De autonomie zet hem gericht naar de eerste richting die het vakje biedt, wat ook de andere kant kan zijn. Stel de richting in via het contextmenu.
autosetup.ui.checkNoProtectingSignal={0} heeft geen gekoppeld sein.
autosetup.ui.checkGuardIsBoth={1} is zowel het inrijsein als het uitrijsein van {0}.  E\u00e9n sein kan niet zowel de weg erin als de weg eruit bewaken: haal het uit een van de twee.
autosetup.ui.checkGuardOffTheWayIn={1} bewaakt {0}, maar geen weg naar {0} komt erlangs, dus een trein die daar aankomt, komt het nooit tegen.  Controleer of dit het bedoelde sein is.
autosetup.ui.checkUnavailableWhileOccupied={0} is niet beschikbaar zolang {1} bezet is.
autosetup.ui.checkDuplicateLocomotive={0} heeft een locomotief staan die ook ergens anders als staand is geregistreerd. Een locomotief kan maar op \u00e9\u00e9n plek staan, en de autonomie weigert de hele configuratie zolang hij op twee staat - haal hem dus weg van het vakje waar hij niet staat.
autosetup.ui.checkNoTrainLength={1} bij {0} heeft geen treinlengte en wordt dus nooit geweigerd op een perron omdat de trein te lang is.
autosetup.ui.checkNoMaxTrainLength={0} heeft geen maximale treinlengte, dus geen enkele trein is er ooit te lang voor.
autosetup.ui.checkHalfMeasuredApproach={0} kan treinen weigeren die er wel in passen, zolang een deel van de toerit gemeten is en een deel niet: {2} vakjes ernaartoe hebben nog geen lengte, en de lengteregels tellen een ongemeten vakje als niets - zo reikt de langste trein tot aan de wissel of kruising erachter en wordt daar geweigerd.  Meet ze - Lengtes in bulk toewijzen loopt ze langs - of wis de lengtes op die toerit.
autosetup.ui.checkRunInShorterThanTheBerth={0} is ingesteld op een trein van {2}, maar tussen het perron en de wissel, kruising of kering erachter is maar {3} spoor vastgelegd - een trein langer dan {3} wordt hier dus geweigerd, wat het maximum ook zegt.  Dat kan juist zijn: een perron van {2} kan uit twee stukken aan weerszijden van een wissel bestaan.  Anders moet er nog spoor gemeten worden.
autosetup.ui.checkRunInShorterThanThePlatform={0} is ingesteld op een trein van {2}, maar tussen het perron en de wissel of kering erachter is maar {3} spoor vastgelegd - een trein langer dan {3} staat hier dus over de wissel en kan andere delen van de baan blokkeren tot hij vertrekt.  Dat kan juist zijn: een perron van {2} kan uit twee stukken aan weerszijden van een wissel bestaan.  Anders moet er nog spoor gemeten worden.
autosetup.ui.checkRunInShorterThanThePlatformRefused={0} is ingesteld op een trein van {2}, maar tussen het perron en de wissel of kering erachter is maar {3} spoor vastgelegd - een trein langer dan {3} staat hier dus over de wissel en kan andere delen van de baan blokkeren tot hij vertrekt.  Via de kortste weg naar binnen, over {4} vastgelegd spoor, wordt een trein langer dan {4} in plaats daarvan geweigerd.  Dat kan juist zijn: een perron van {2} kan uit twee stukken aan weerszijden van een wissel bestaan.  Anders moet er nog spoor gemeten worden.
autosetup.ui.checkBerthTrackGivenNoLength={0} weigert elke trein met een lengte die over het spoor erachter binnenkomt: elk vak tussen {0} en de wissel of kruising erachter heeft lengte 0 gekregen, dus de opgegeven lengte van dat spoor is samen 0.  Geef dat spoor zijn echte lengte als treinen bij {0} moeten stoppen.
autosetup.ui.checkDuplicateSensorPage={1}, dus \u00e9\u00e9n sensor staat voor twee plaatsen en geen trein daarop is te lokaliseren.  Schakel een van de pagina\u2019s uit, of geef een van beide vakjes een eigen sensor.
