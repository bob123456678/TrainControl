route.ui.helpMessage=Routes zijn simpelweg een reeks opdrachten die na elkaar worden uitgevoerd. Gebruik de wizard totdat je vertrouwd bent met het zelf typen van opdrachten.\n\nVoer in het veld Route-opdrachten \u00e9\u00e9n opdracht per regel in: de naam van het accessoire en de stand, gescheiden door een komma. Bijvoorbeeld: Switch 20,turn of Signal 21,green. Je kunt het accessoiretype ook weglaten: 20,straight of 21,red. Nog korter: vervang turn/red door 1 en straight/green door 0. Een optioneel derde getal geeft een vertraging voor de uitvoering aan, in milliseconden.\n\nAls je wilt dat je route automatisch wordt uitgevoerd, geef dan het adres van een activerende S88-terugmelder op en zet Automatische uitvoering op "Aan".\n\nMet optionele voorwaarden kun je logica opgeven met S88-terugmelders en/of accessoirestanden (in hetzelfde formaat als hierboven), waaraan ook voldaan moet zijn voordat de route automatisch wordt uitgevoerd. Booleaanse logica met OR, AND en haakjes is toegestaan. Als het activerende S88-adres bijvoorbeeld 10 is en de S88-voorwaarde "Feedback 11,0", dan wordt de route alleen uitgevoerd als S88 11 vrij is op het moment dat S88 10 wordt geactiveerd.\n\nNaast accessoires kunnen route-opdrachten ook verwijzen naar andere routes of naar de snelheid, rijrichting en functies van een locomotief:\nlocspeed,Naam van de locomotief,50 (stelt de snelheid in op 50)\nlocspeed,Naam van de locomotief,-1 (onmiddellijke stop)\nlocdir,Naam van de locomotief,forward (of backward)\nlocfunc,Naam van de locomotief,20,1 (schakelt F20).
