autosetup.ui.checkArrivalTrapped=Een trein die {0} vanuit minstens \u00e9\u00e9n richting bereikt, zou niet verder kunnen: het enige spoor voor hem is het spoor waarover hij net is gekomen, en een trein kan hier niet keren. Stel ofwel "treinen mogen hier van richting veranderen" in, of open de weg voorwaarts.
autosetup.ui.checkUnnamedStation=Het station bij {0} heeft nog de automatisch gegeven naam. Het is de naam waaronder u het kiest en waaronder aankomsten worden omgeroepen, geef het dus een naam die u ook hardop zou gebruiken.
