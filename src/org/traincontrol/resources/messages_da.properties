# Replace the values as these are translated.
autolayout.errorAutoDestinationInvalidValue=The autoDestination value for point {0} must be true or false.
autosetup.ui.errorScissorsNotSupported=Et sakse-sporskifte ved {0} kan ikke bruges til autonomi. Det er en m\u00e5de at tegne et dobbelt engelsk sporskifte fordelt over to felter p\u00e5, s\u00e5 sporforl\u00f8bet gennem det ikke kan udledes af nogen af de to felter alene. Erstat det med almindelige sporskiftefelter, eller lad den side v\u00e6re ude af autonomien.
autosetup.ui.errorTileHasNoAddress=Sporskiftet eller signalet ved {0} har ingen digital adresse, s\u00e5 TrainControl kan ikke stille det. Et tog sendt over det ville stole p\u00e5, at det allerede ligger rigtigt. Giv det en adresse, eller lad den side v\u00e6re ude af autonomien.
autosetup.ui.errorAdjacentRouteTiles={0}: To ruteknapper st\u00e5r ved siden af hinanden med spor, der f\u00f8rer ind i dem, s\u00e5 parret leder en rute hen over sporplan uden skinner.  Flyt den ene v\u00e6k fra sporet.
autosetup.ui.errorRouteTileThreeWay={0}: Der f\u00f8rer spor ind i denne ruteknap fra tre sider.  Den kan lede \u00e9n rute igennem, s\u00e5 den tredje falder bort - tegn forgreningen p\u00e5 en sporskifte i stedet for p\u00e5 en knap.
autosetup.ui.errorLinkNotMutuallyPaired=Forbindelsen ved {0} er ikke parret med en forbindelse, der peger tilbage p\u00e5 den. Hver forbindelse skal angive netop \u00e9n partner, og den partner skal angive den igen, ellers kunne et tog krydse den og ikke kunne komme tilbage.
autosetup.ui.warnLinkNeverPaired=Forbindelsen ved {0} er ikke parret med noget, s\u00e5 den f\u00f8rer ingen steder hen: sporet, der l\u00f8ber ind i den, ender der, og det, den skulle forts\u00e6tte til, kan ikke n\u00e5s ad denne vej. H\u00f8jreklik p\u00e5 den for at parre den, eller sl\u00e5 den fra, s\u00e5 den ikke bliver rapporteret igen.
autosetup.ui.warnLinkNeverPairedUnreachable=Forbindelsen ved {0} er ikke blevet parret, men der l\u00f8ber heller ikke noget spor hen til den - s\u00e5 intet kan n\u00e5 den. Par den, hvis den skulle f\u00f8re et sted hen, eller lad den v\u00e6re ude af autonomien.
autosetup.ui.warnLinkToExcludedPage=Forbindelsen ved {0} peger p\u00e5 en side, der ikke er en del af autonomien, s\u00e5 der er intet at parre den med: sporet, der f\u00f8rer hen til den, ender der. Tag den side med i autonomien, hvis ruten betyder noget, eller sl\u00e5 forbindelsen fra, s\u00e5 den ikke rapporteres igen.
autosetup.ui.errorNotANumber="{0}" er ikke et helt tal, s\u00e5 der er ikke \u00e6ndret noget.
autosetup.ui.errorLabelWriteFailed=Stationsnavne, der tidligere blev gemt i sporplanen, holdes nu sammen med autonomiops\u00e6tningen, men disse sider kunne ikke skrives om for at fjerne de gamle kopier: {0}. Der er ikke g\u00e5et noget tabt, og TrainControl pr\u00f8ver igen n\u00e6ste gang det starter.
autosetup.ui.errorEditorAlreadyOpen=Der er allerede en editor \u00e5ben p\u00e5 denne sporplan. Luk den, f\u00f8r du \u00e5bner en anden - to af dem deler \u00e9n sporplan, og hver ville fortryde den andens \u00e6ndringer.
autosetup.ui.errorNoSetupToEdit=Autonomiops\u00e6tningen kan ikke \u00e5bnes for denne sporplan.\n\nDen kr\u00e6ver en lokal sporplansmappe, som TrainControl kan skrive til.
autosetup.ui.confirmExitWithoutSaving=Luk autonomi-editoren og smid alt v\u00e6k, der er \u00e6ndret siden sidste gemning?\n\nDet g\u00e6lder ogs\u00e5 ethvert stationsnavn, du har sat p\u00e5 sporplanen i dette vindue.
autosetup.ui.confirmJumpWithUnsavedEdits=G\u00e5 til den anden ende af denne forbindelse?\n\nDette vindue lukker og \u00e5bner igen p\u00e5 den side. Intet g\u00e5r tabt - alt, du har \u00e6ndret, bevares - men det er endnu ikke gemt.
autosetup.ui.errorDiscardFailed=\u00c6ndringerne kunne ikke kasseres, fordi den gemte ops\u00e6tning ikke kunne l\u00e6ses tilbage: {0}. Editoren er blevet ladt \u00e5ben, s\u00e5 intet g\u00e5r tabt.
autosetup.ui.menuFacingGroup={0} vender mod...
autosetup.ui.hintFacing=Hvilken vej toget holder. To spor n\u00e5r frem til dette felt, s\u00e5 et tog her kunne v\u00e6re ankommet ad begge, og hvilken vej det peger afg\u00f8r, hvor det kan k\u00f8re hen n\u00e6ste gang - et tog kan ikke starte bagl\u00e6ns. Lad det v\u00e6re u\u00e6ndret, hvis du er i tvivl: autonomien retter det, f\u00f8rste gang toget k\u00f8rer.
autosetup.ui.facingN=Nord (op ad sporplanen)
autosetup.ui.facingE=\u00d8st (til h\u00f8jre)
autosetup.ui.facingS=Syd (nedad)
autosetup.ui.facingW=Vest (til venstre)
autosetup.ui.menuUseLink=Autonomien bruger denne forbindelse
autosetup.ui.hintUseLink=Sl\u00e5 dette fra for en forbindelse, der h\u00f8rer til tegningen frem for til den bane, autonomien k\u00f8rer p\u00e5. Den fragter s\u00e5 ingen tog og bliver ikke rapporteret som uparret.
autosetup.ui.errorPortalTargetsExcludedPage=Forbindelsen ved {0} peger p\u00e5 en side, der er ude af autonomien. Par den enten med en forbindelse p\u00e5 en side, autonomien bruger, eller lad den v\u00e6re uparret, s\u00e5 intet tog fors\u00f8ger at krydse den.
autosetup.ui.warnTurntableNotRoutable=Autonomien stopper ved drejeskiven ved {0} og k\u00f8rer aldrig tog hen over den. Resten af sporplanen er up\u00e5virket.
autosetup.ui.warnPermanentTurnout=Sporskiftet ved {0} er markeret som uden adresse, s\u00e5 tog m\u00e5 kun passere det i spidssporet retning, hvor tungernes stilling ikke betyder noget.
autosetup.ui.errorCompanionVersion=Denne autonomiops\u00e6tning blev skrevet af en nyere version af TrainControl og kan ikke l\u00e6ses. Opdater TrainControl, eller flyt filerne i config/autonomy v\u00e6k for at starte forfra.
autosetup.ui.errorDeleteConfigurationFailed=Kunne ikke slette {0}. Filen er m\u00e5ske \u00e5ben i et andet program, holdt fast af en synkroniseringsklient, eller i en mappe, denne computer ikke kan skrive til.
autosetup.ui.errorRenameConfigurationFailed=Kunne ikke omd\u00f8be {0}. Filen er m\u00e5ske \u00e5ben i et andet program, holdt fast af en synkroniseringsklient, eller i en mappe, denne computer ikke kan skrive til. Der er ikke \u00e6ndret noget.
autosetup.ui.errorConfigurationUnreadable=Autonomikonfigurationen {0} kunne ikke l\u00e6ses, s\u00e5 der er ikke \u00e6ndret noget: {1}
autosetup.ui.errorAutonomyNeedsLocalLayout=Autonomi kr\u00e6ver en lokal kopi af sporplanen, fordi dens indstillinger gemmes sammen med sporplanens filer. Hent f\u00f8rst layoutet fra Central Station.
autosetup.ui.checkStationReachesNothing=Intet tog kan forlade {0} mod en anden station. Tjek retningerne p\u00e5 sporene, der l\u00f8ber derfra.
autosetup.ui.checkStationUnreachable=Intet tog kan n\u00e5 {0} fra en anden station.  Tjek retningerne p\u00e5 sporene dertil, og om ankomster fra adgangssiden afvises.
autosetup.ui.checkTerminusStranded=Et tog sendt til {0} ville ikke kunne n\u00e5 nogen anden station.  Tjek retningerne p\u00e5 sporene derfra, og om ankomster fra afgangssiden afvises.
autosetup.ui.checkPointIsolated=Intet er forbundet til {0}, s\u00e5 intet tog vil nogensinde passere det. Sporet er tegnet, men enhver forbindelse til det er lukket.
autosetup.ui.checkRunClosedBothWays=Sporet ved {0} er lukket i begge retninger, s\u00e5 intet kan passere det. Det er som regel et fejlklik, da envejsk\u00f8rsel blev sat op.
autosetup.ui.checkNoStations=Der er endnu ikke udpeget nogen station, s\u00e5 autonomien har ingen steder at sende et tog hen. Mark\u00e9r mindst to sensorer som stationer.
autosetup.ui.checkOneStation={0} er den eneste station, s\u00e5 autonomien har ingen andre steder at sende et tog hen. Udpeg mindst \u00e9n mere.
autosetup.ui.checkUnnamedPoint=Sensoren ved {0} har stadig det navn, den fik automatisk. Tog passerer den frem for at stoppe ved den, s\u00e5 det er mere noget at rydde op i end akut - men det er det navn, en tur her igennem vil blive kaldt.
autosetup.ui.checkMayTurnOnDeadEnd={0} er sat til "tog m\u00e5 skifte retning her", men intet ankommende tog kan k\u00f8re videre - hver indk\u00f8rsel f\u00f8rer kun tilbage, s\u00e5 de vender alligevel alle sammen.  "Skal" siger det tydeligere.
autosetup.ui.checkReversingLeadsNowhere=Tog vender ved {0}, men derfra kan ingen station naas - et tog sendt dertil ville vende og stadig ikke have nogen steder at koere hen. Hvis vejen frem skulle vaere aaben, er det dette felt, der skal ses paa.
autosetup.ui.checkCaptionCovered=Navnet p\u00e5 {0} kan ikke ses: feltet, dets billedtekst er tegnet p\u00e5, b\u00e6rer ogs\u00e5 din egen tekst, og det er din tekst, der vises. Flyt billedteksten til et ledigt felt, eller ryd teksten.
autosetup.ui.checkHomeNeedsReversible=Hjemstationen ved {0} kan kun bruges af et lokomotiv, der kan skifte retning. Hvert tog skal vende p\u00e5 dette felt, s\u00e5 et tog, der ikke kan, bliver aldrig sendt hjem hertil.
autosetup.ui.checkReversalNeedsLength=Tog vender ved {0}, og der er ikke registreret nogen laengde for sporet, saa det kan ikke afgoeres, om et langt tog ville staa hen over sporskiftet bagved.  Angiv sporlaengden.
autosetup.ui.checkReversalNeedsLengthRun=Tog vender ved {0}, og {2} felter der og paa vejen ind har ingen registreret laengde, saa det kan ikke afgoeres, om et langt tog ville staa hen over sporskiftet bagved.  Angiv sporlaengderne.
autosetup.ui.checkCopyNoWayOut=Et tog, der ankommer til {0} fra den side, kan ikke koere videre - der er intet spor ud.  Automatikken kan stadig sende et derhen.  Aabn en udkoersel, eller spaer ankomst fra den side.
autosetup.ui.checkCopyNoWayIn=Intet kan naa {0} - der er intet spor ind.  Et tog, der efterlades der, flyttes ikke af hjemkoerslen og spaerrer for alt bagved.
autosetup.ui.checkCopyReachesNothing=Et tog, der ankommer til {0} fra den side, kommer ikke videre - derfra kan ingen anden station naas.  Det kan godt koere ud, men hver vej foerer tilbage til samme sted.  Automatikken kan stadig sende et derhen.  Aabn en videre forbindelse, eller spaer ankomst fra den side.
autosetup.ui.checkProtectingSignalGone=Et signal parret med {0} er ikke l\u00e6ngere p\u00e5 denne sporplan, s\u00e5 den perron er ikke l\u00e6ngere fuldt sikret. Par det med et andet signal, eller fjern parringen.
autosetup.ui.checkFacingImpossible={0} har et lokomotiv registreret som vendende en vej, dette felt ikke l\u00e6ngere tillader - sporet omkring det er \u00e6ndret siden. Autonomien placerer det vendt den f\u00f8rste vej, feltet tilbyder, hvilket kan v\u00e6re den anden. Indstil retningen fra h\u00f8jreklik-menuen.
autosetup.ui.checkNoProtectingSignal={0} har intet signal tilknyttet.
autosetup.ui.checkDuplicateLocomotive={0} har et lokomotiv, der ogs\u00e5 er registreret som st\u00e5ende et andet sted. Et lokomotiv kan kun v\u00e6re \u00e9t sted, og autonomien afviser hele ops\u00e6tningen, s\u00e5 l\u00e6nge det st\u00e5r to steder - fjern det derfor fra det felt, det ikke st\u00e5r p\u00e5.
autosetup.ui.checkNoTrainLength={1} ved {0} har ingen togl\u00e6ngde og afvises derfor aldrig fra en perron for at v\u00e6re for langt.
autosetup.ui.checkNoMaxTrainLength={0} har ingen maksimal togl\u00e6ngde, s\u00e5 intet tog er nogensinde for langt.
autosetup.ui.checkDuplicateSensorPage={1}, s\u00e5 \u00e9n sensor st\u00e5r for to steder, og intet tog derp\u00e5 kan lokaliseres.  Sl\u00e5 en af siderne fra, eller giv et af de to felter sin egen sensor.
autosetup.ui.duplicateSensorSubject=Sensoren s88 {0} er p\u00e5 siden \u201e{1}\u201c og ogs\u00e5 p\u00e5 siden \u201e{2}\u201c
autosetup.ui.checkArrivalTrapped=Et tog, der n\u00e5r {0} fra mindst \u00e9n retning, kunne ikke forts\u00e6tte: det eneste spor foran det er det, det lige er kommet ad, og et tog kan ikke vende her. S\u00e6t enten "tog m\u00e5 skifte retning her", eller \u00e5bn vejen fremad.
