route.ui.frameLogicDisagrees=En del af logikken er markeret med r\u00f8dt: to forskellige ord p\u00e5 samme niveau betyder to forskellige ting. Ryk de betingelser ind, du ville gruppere, eller g\u00f8r ordene ens.
