route.ui.frameLockedExplains=Denne rute tilh\u00f8rer Central Station. \u00c6ndr den der, og synkroniser igen.
route.ui.frameHelp=En rute g\u00f8r to ting: den udf\u00f8rer kommandoerne \u00f8verst i r\u00e6kkef\u00f8lge, og den kan holdes tilbage, indtil banen er i en bestemt tilstand.\n\nKOMMANDOER\n\nHver r\u00e6kke er \u00e9n ting, der skal ske - stille et sporskifte, s\u00e6tte et signal, k\u00f8re en anden rute. R\u00e6kkef\u00f8lgen ER ruten. Forsinkelseskolonnen holder den n\u00e6ste kommando tilbage, mens en langsom motor bliver f\u00e6rdig.\n\nEt trevejssporskifte er \u00e9n r\u00e6kke. Det er i virkeligheden to motorer p\u00e5 to p\u00e5 hinanden f\u00f8lgende adresser, og r\u00e6kken skriver begge kommandoer i den r\u00e6kkef\u00f8lge, de skal sendes i, med en pause imellem.\n\nBETINGELSER\n\nRuten holdes tilbage, indtil disse er sande. Hver r\u00e6kke er \u00e9n kendsgerning, og og/eller-linjen mellem to r\u00e6kker siger, hvordan de h\u00e6nger sammen.\n\nRyk en r\u00e6kke ind for at indlejre den. Alt p\u00e5 samme indrykningsniveau er \u00e9n gruppe, og ordet p\u00e5 det niveau samler den. Alle ord p\u00e5 samme niveau skal v\u00e6re det samme ord; et, der afviger, vises med r\u00f8dt. Nedenunder ser du, hvad det hele betyder med ord.\n\nTest afl\u00e6ser sensorerne, som de er lige nu, og siger, om ruten ville udl\u00f8ses.\n\nLad betingelserne st\u00e5 tomme, s\u00e5 udl\u00f8ses ruten, hver gang den trigges.
